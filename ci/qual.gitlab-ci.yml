# ci/qual.gitlab-ci.yml (QUAL, REQ-QUAL-64). Storybook build, the twelve certification lanes and the QUAL-only jobs.
# Every lane job is exactly LANE_COMMAND (`node certification/run.mjs --lane <id> --scope $AG_SCOPE`, S-43); the
# lane runner (packages/qa/src/evidence/laneRunner.ts) discovers registrations from certification/lanes.config.ts
# and fragments/lanes/<stream>.ts, fails closed (REQ-QUAL-06) and writes .artifacts/qual/<job-slug>/lane-manifest.json.
# Evidence is GitLab job artifacts only (REQ-QUAL-60, S-48): evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA, when: always,
# expire_in per EVIDENCE.expireIn (pr/main 14 days, nightly 30 days, release 90 days via .ag-evidence-release).
# Activation (contract §2.3): every job starts `allow_failure: true` and is flipped to false here after its first
# green run on next (the flip is a ci/plat/activation.json row, FIN-B). qual:certify:release never allows failure.
# Cross-stream needs name only CI_JOBS entries, always optional: true. No credentials, no GitHub machinery.
# REQ-QUAL-56/-57 (FIN-452): qual:build:storybook is dist-backed (AG_STORYBOOK_DIST=1, dist/ from the optional
# plat:build:dist artifact, else `npm run build`), checked by check-build-log.mjs and stamped with ag-build.json.
# Every consumer of the built Storybook runs verify-fresh.mjs first.

.qual-node-lane:
  extends: .ag-node
  stage: certify
  needs:
    - { job: "plat:build:dist", artifacts: true, optional: true }
    - { job: "mat:build:tokens", artifacts: true, optional: true }
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main")
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths: [.artifacts/qual/$CI_JOB_NAME_SLUG/]

# L2/L3/L4 consume the tarball: AURAGLASS_TARBALL from plat:package:pack's dotenv, else `npm pack` of the built dist/.
# REQ-QUAL-33 (4.x coverage today): main-scope l2/l3/l11 and the nightly first run `--line 4x`, which packs
# aura-glass@$AG_V4_DIST_TAG from the public registry and the release/4.x head (`git fetch origin release/4.x` with the
# job's own access, npm ci + build + pack in a scratch worktree) and runs L2/L3/L11 against both; rows are `line: 4x`
# and never blocking (the 4x run exits non-zero only on a runner/manifest error). It runs before the 5.x LANE_COMMAND
# so a failing 5.x lane cannot skip the 4.x evidence.
.qual-tarball-lane:
  extends: .qual-node-lane
  needs:
    - { job: "plat:package:pack", artifacts: true, optional: true }
    - { job: "plat:build:dist", artifacts: true, optional: true }
    - { job: "mat:build:tokens", artifacts: true, optional: true }

.qual-browser-lane:
  extends: .ag-playwright
  stage: certify
  needs:
    - { job: "qual:build:storybook", artifacts: true, optional: true }
    - { job: "plat:package:pack", artifacts: true, optional: true }
    - { job: "plat:build:dist", artifacts: true, optional: true }
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main")
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths: [.artifacts/qual/$CI_JOB_NAME_SLUG/]

qual:build:storybook:
  extends: .ag-node
  stage: build
  allow_failure: true
  rules:
    - if: $AG_LINE == "5x"
  script:
    # REQ-QUAL-09..11 / REQ-FIN-106: preview, StoryRoot readiness and determinism unit tests gate the build
    - npx jest --ci tests/storybook
    # REQ-QUAL-56: story typecheck gates the build
    - node_modules/.bin/tsc --noEmit -p tsconfig.storybook.json
    # REQ-QUAL-56: dist from plat:build:dist (else npm run build), then AG_STORYBOOK_DIST=1 storybook build
    # REQ-QUAL-49: storySort is current with ComponentMeta.flagship (Storybook reads it statically from preview.tsx)
    - node scripts/storybook/lint-titles.mjs --check-story-sort
    - node scripts/storybook/build.mjs
    - node scripts/storybook/check-build-log.mjs --dir storybook-static
    # REQ-QUAL-49..52 (FIN-450): APG index for the docs pages, title lint on the built index (per owner, expiring
    # baseline), Start Here links/counts against the built index. Writers into storybook-static/ run before any
    # build-manifest/freshness stamp.
    - mkdir -p ".artifacts/qual/$CI_JOB_NAME_SLUG"
    - node scripts/storybook/write-apg-index.mjs --out storybook-static/apg-index.json
    - node scripts/storybook/lint-titles.mjs --index storybook-static/index.json --json ".artifacts/qual/$CI_JOB_NAME_SLUG/story-titles.json"
    - node scripts/storybook/verify-start-here.mjs --index storybook-static/index.json
    # REQ-QUAL-01: SubjectIndex (REPORTS.subjects) from index.json + parameters.ag; fails on mismatch.
    - node --experimental-strip-types scripts/storybook/write-cert-manifest.mjs --dir storybook-static
    - node scripts/storybook/write-build-manifest.mjs --dir storybook-static
    - node scripts/storybook/verify-fresh.mjs --dir storybook-static
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths: [storybook-static/, .artifacts/qual/$CI_JOB_NAME_SLUG/]
qual:test:storybook-flows:
  # REQ-QUAL-57: S1 showcase primary-task flows + Lab control round-trips against the fresh built Storybook
  extends: .ag-playwright
  stage: test
  allow_failure: true
  needs:
    - { job: "qual:build:storybook", artifacts: true }
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main")
  script:
    - AURAGLASS_EVIDENCE_DIR=".artifacts/qual/$CI_JOB_NAME_SLUG" node scripts/storybook/run-flows.mjs --dir storybook-static -- --output ".artifacts/qual/$CI_JOB_NAME_SLUG/test-results"
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths: [.artifacts/qual/$CI_JOB_NAME_SLUG/]

# ---------------------------------------------------------------- the twelve lanes (CERT_JOBS)
qual:certify:l1:
  extends: .qual-node-lane
  allow_failure: true
  script:
    - node certification/run.mjs --lane L1 --scope $AG_SCOPE
qual:certify:l2:
  extends: .qual-tarball-lane
  allow_failure: true
  script:
    # REQ-QUAL-33: on main also L2 against the published and release/4.x-head 4.x tarballs (line-4x/ manifest, never blocking).
    - if [ "$AG_SCOPE" = "main" ]; then node certification/run.mjs --lane L2 --scope main --line 4x; fi
    - node certification/run.mjs --lane L2 --scope $AG_SCOPE
qual:certify:l3:
  extends: .qual-tarball-lane
  allow_failure: true
  script:
    # REQ-QUAL-33: on main also L3 against the published and release/4.x-head 4.x tarballs (line-4x/ manifest, never blocking).
    - if [ "$AG_SCOPE" = "main" ]; then node certification/run.mjs --lane L3 --scope main --line 4x; fi
    - node certification/run.mjs --lane L3 --scope $AG_SCOPE
qual:certify:l4:
  extends: .qual-tarball-lane
  allow_failure: true
  script:
    - node certification/run.mjs --lane L4 --scope $AG_SCOPE
qual:certify:l5:
  extends: .qual-browser-lane
  allow_failure: true
  script:
    - node scripts/storybook/verify-fresh.mjs --dir storybook-static
    - node certification/run.mjs --lane L5 --scope $AG_SCOPE
qual:certify:l6:
  extends: .qual-browser-lane
  allow_failure: true
  script:
    - node scripts/storybook/verify-fresh.mjs --dir storybook-static
    - node certification/run.mjs --lane L6 --scope $AG_SCOPE
  # REQ-QUAL-65: pipeline wall time to the end of the heaviest PR/main lane vs the 20/45-minute budget; reported
  # (5 consecutive overruns → budget-report.json for the GA dashboard), never failing.
  after_script:
    - node scripts/qual/shard-plan.mjs budget --scope $AG_SCOPE --out-dir .artifacts/qual/$CI_JOB_NAME_SLUG
qual:certify:l7:
  extends: .qual-browser-lane
  allow_failure: true
  variables:
    GIT_DEPTH: "0"
    AG_STORYBOOK_URL: "http://127.0.0.1:6006"
    AG_STORYBOOK_BASE_URL: "http://127.0.0.1:6007"
    AG_L7_BASE: ".artifacts/qual/l7-base.json"
  script:
    - node scripts/storybook/verify-fresh.mjs --dir storybook-static
    - git fetch --no-tags origin "+refs/heads/next:refs/remotes/origin/next"
    - node scripts/qual/l7-base.mjs --scope "$AG_SCOPE" --dir /tmp/ag-l7-base --out "$AG_L7_BASE"
    - node scripts/qual/serve-static.mjs storybook-static 6006 &
    - if test -f /tmp/ag-l7-base/storybook-static/index.json; then node scripts/qual/serve-static.mjs /tmp/ag-l7-base/storybook-static 6007 & fi
    - node certification/run.mjs --lane L7 --scope "$AG_SCOPE"
qual:certify:l8:
  extends: .qual-browser-lane
  allow_failure: true
  script:
    - node scripts/storybook/verify-fresh.mjs --dir storybook-static
    - node certification/run.mjs --lane L8 --scope $AG_SCOPE
qual:certify:l9:
  extends: .qual-browser-lane
  allow_failure: true
  script:
    - node scripts/storybook/verify-fresh.mjs --dir storybook-static
    - node certification/run.mjs --lane L9 --scope $AG_SCOPE
# L10 Performance (REQ-QUAL-34..36). Profiles b, c, d on .ag-playwright; profile a on .ag-gpu (qual:certify:l10-gpu).
# Every perf step runs (rc collects failures), then the lane runner; the job exits non-zero if any step failed (no
# fail-open). allow_failure flips through ci/plat/activation.json.
qual:certify:l10:
  extends: .qual-browser-lane
  allow_failure: true
  variables: { AG_STORYBOOK_STATIC: "$CI_PROJECT_DIR/storybook-static" }
  timeout: 90m
  # Build-stage inputs only (Storybook + dist for bundle bytes), so L10 is not skipped behind package-stage jobs.
  needs: &qual-l10-needs
    - { job: "qual:build:storybook", artifacts: true, optional: true }
    - { job: "plat:build:dist", artifacts: true, optional: true }
  script:
    - |
      rc=0
      node node_modules/jest/bin/jest.js --ci --testPathIgnorePatterns /node_modules/ \
        --testMatch '**/packages/qa/test/bci.test.ts' '**/tests/perf/qual/run-perf.test.mjs' '**/tests/storybook/perf-fixtures-index.test.mjs' \
        '**/packages/qa/test/grade.test.ts' '**/packages/qa/test/perf-budgets.test.ts' '**/packages/qa/test/perf-ratchet.test.ts' \
        '**/packages/qa/test/perf-surface-4x.test.ts' '**/tests/perf/qual/budgets-frozen.test.ts' \
        '**/tests/perf/qual/invariants.test.mjs' || rc=1
      npx playwright test -c tests/perf/qual/playwright.config.ts --project qual:l10-selftest || rc=1
      node tests/perf/harness/run-perf.mjs --profile b,c,d --scope "$AG_SCOPE" || rc=1
      AG_L10_STREAMS=1 npx playwright test -c tests/perf/qual/playwright.config.ts --project qual:l10-streams || rc=1
      # REQ-QUAL-42/-43 invariants (G-22): leak (Chromium) + backdrop root, lens defs, WebGL, a11y fallback (3 engines).
      AG_L10_INVARIANTS=1 npx playwright test -c tests/perf/qual/playwright.config.ts \
        --project qual:l10-invariants-chromium --project qual:l10-invariants-webkit --project qual:l10-invariants-firefox || rc=1
      # REQ-QUAL-38/-41 (G-21): resolved budgets, surface budgets in 3 engines, 4.1-regression on profile (c).
      # pw-verdict applies the lane runner's rule: only an all-`pending:` report below release scope is not a failure.
      node scripts/qual/perf/resolve-budgets.mjs --scope "$AG_SCOPE" || rc=1
      AG_L10_SERVE=1 AG_L10_REPORT=surface-budget AG_STORYBOOK_URL=http://127.0.0.1:6006 npx playwright test -c tests/perf/qual/playwright.config.ts \
        --project qual:l10-surface-budget-chromium --project qual:l10-surface-budget-webkit --project qual:l10-surface-budget-firefox || pw=$?
      node scripts/qual/perf/pw-verdict.mjs ".artifacts/qual/$CI_JOB_NAME_SLUG/playwright-surface-budget.json" --scope "$AG_SCOPE" --exit "${pw:-0}" || rc=1
      pw=0
      AG_L10_SERVE=1 AG_L10_REPORT=regression-4x AG_STORYBOOK_URL=http://127.0.0.1:6006 npx playwright test -c tests/perf/qual/playwright.config.ts \
        --project qual:l10-regression-4x || pw=$?
      node scripts/qual/perf/pw-verdict.mjs ".artifacts/qual/$CI_JOB_NAME_SLUG/playwright-regression-4x.json" --scope "$AG_SCOPE" --exit "${pw:-0}" || rc=1
    - node certification/run.mjs --lane L10 --scope $AG_SCOPE
    - exit $rc
qual:certify:l11:
  extends: .qual-browser-lane
  allow_failure: true
  script:
    # REQ-QUAL-33: on main also L11 against the published and release/4.x-head 4.x tarballs (line-4x/ manifest, never blocking).
    - if [ "$AG_SCOPE" = "main" ]; then node certification/run.mjs --lane L11 --scope main --line 4x; fi
    - node certification/run.mjs --lane L11 --scope $AG_SCOPE
qual:certify:l12:
  extends: .qual-node-lane
  allow_failure: true
  variables: { GIT_DEPTH: "0" }
  script:
    # REQ-QUAL-30 ratchet compares certification/ratchets.json with the merge base of the line's base branch.
    - git fetch --no-tags origin "+refs/heads/next:refs/remotes/origin/next"
    - node certification/run.mjs --lane L12 --scope $AG_SCOPE

# ---------------------------------------------------------------- whole-matrix scopes
# qual:certify:release (REQ-QUAL-63, G-16) writes .artifacts/qual/release-verdict.json (S-55 ReleaseVerdict), the
# rendered checklist .artifacts/qual/release-checklist.md and, only when the evidence is complete,
# .artifacts/qual/claims.json (REQ-QUAL-62); .ag-evidence-release keeps all of .artifacts/ for 90 days.
qual:certify:nightly:
  extends: .qual-browser-lane
  allow_failure: true
  variables: { GIT_DEPTH: "0" }
  rules:
    - if: $AG_SCOPE == "nightly" && $AG_LINE == "5x"
  script:
    - git fetch --no-tags origin "+refs/heads/next:refs/remotes/origin/next"
    - node scripts/storybook/verify-fresh.mjs --dir storybook-static
    # REQ-QUAL-33: L2/L3/L11 against the published and release/4.x-head 4.x tarballs (line-4x/ manifest, never blocking).
    - node certification/run.mjs --lane all --scope nightly --line 4x
    - node certification/run.mjs --lane all --scope nightly
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 30 days
    paths: [.artifacts/qual/$CI_JOB_NAME_SLUG/]
# REQ-QUAL-65: L6 at release comes from the sharded child pipeline (qual:certify:release-matrix): the shard lane
# manifests are downloaded through the jobs API with CI_JOB_TOKEN (shard-plan.mjs collect) and the lane runner
# evaluates L6 from that summary (AG_RELEASE_SHARDS); a missing, stale or failing shard fails L6.
qual:certify:release:
  extends: [.qual-browser-lane, .ag-evidence-release]
  variables: { GIT_DEPTH: "0" }
  rules:
    - if: $AG_SCOPE == "release" && $AG_LINE == "5x"
  needs:
    - { job: "qual:build:storybook", artifacts: true, optional: true }
    - { job: "plat:package:pack", artifacts: true, optional: true }
    - { job: "plat:build:dist", artifacts: true, optional: true }
    - { job: "qual:certify:release-plan", artifacts: true }
    - { job: "qual:certify:release-matrix", artifacts: false }
  script:
    - git fetch --no-tags origin "+refs/heads/next:refs/remotes/origin/next"
    - node scripts/storybook/verify-fresh.mjs --dir storybook-static
    - |
      rc=0
      node scripts/qual/shard-plan.mjs collect --plan .artifacts/qual/qual-certify-release-plan/shards.json \
        --out .artifacts/qual/$CI_JOB_NAME_SLUG/shards-summary.json || rc=1
      AG_RELEASE_SHARDS=.artifacts/qual/$CI_JOB_NAME_SLUG/shards-summary.json \
        node certification/run.mjs --lane all --scope release --verdict .artifacts/qual/release-verdict.json || rc=1
      exit $rc
  after_script:
    - node scripts/qual/shard-plan.mjs budget --scope release --out-dir .artifacts/qual/$CI_JOB_NAME_SLUG

# ---------------------------------------------------------------- QUAL-only jobs (not referenced by other streams)
# packages/qa unit suite + harness self-tests (offline; starts at once).
qual:test:selftest:
  extends: .ag-node
  stage: test
  allow_failure: true
  needs: []
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main")
  script:
    - node node_modules/jest/bin/jest.js -c jest.qual.config.js --ci
    # REQ-QUAL-67 (G-04): egress-CA preflight (exit 78 on an expired / ≤ 7-day CA).
    - node node_modules/jest/bin/jest.js --ci scripts/qual/remote/preflight.test.mjs
    # REQ-QUAL-48 (G-25): Device Farm / mac1.metal runner offline self-check.
    - node scripts/qual/devices/device-farm-run.mjs --self-check --out .artifacts/qual/$CI_JOB_NAME_SLUG/self-check.json
    - node node_modules/jest/bin/jest.js --ci tests/perf/qual/device-farm-self-check.test.mjs
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths: [.artifacts/qual/$CI_JOB_NAME_SLUG/]

# L10 (a) on the GPU runner (REQ-QUAL-34..36, G-20).
qual:certify:l10-gpu:
  extends: [.qual-browser-lane, .ag-gpu]
  allow_failure: true
  parallel: 6
  variables:
    GIT_DEPTH: "0"
    AG_RUNNER_CLASS: gpu
    # Ask the NVIDIA container runtime for the graphics/display userspace. With the stock Playwright image no NVIDIA
    # userspace is present (nvidia-smi missing; Chromium lands on llvmpipe/SwiftShader), and run-perf.mjs fails profile
    # (a) with software-compositing/software-raster until the runner image carries the drivers (infra item, G-20 PR).
    NVIDIA_VISIBLE_DEVICES: "all"
    NVIDIA_DRIVER_CAPABILITIES: "all"
  timeout: 90m
  needs: *qual-l10-needs
  rules:
    - if: $AG_LINE == "5x" && $AG_SCOPE == "main"
    - if: $AG_LINE == "5x" && $AG_SCOPE == "pr"
      changes: [src/**/*, tests/perf/harness/**/*, stories/qual/perf/**/*, packages/qa/src/perf/**/*, ci/qual.gitlab-ci.yml]
  script:
    - if command -v nvidia-smi >/dev/null; then nvidia-smi -L; else echo "nvidia-smi not present in $AG_PLAYWRIGHT_IMAGE"; fi
    - git fetch --no-tags origin "+refs/heads/next:refs/remotes/origin/next"
    - |
      rc=0
      out=".artifacts/qual/$CI_JOB_NAME_SLUG"
      if [ "$AG_SCOPE" = "pr" ]; then sel="--base origin/next"; else sel="--all"; fi
      SUBJECTS=$(node scripts/qual/perf/affected.mjs $sel --shard "$CI_NODE_INDEX/$CI_NODE_TOTAL" --out "$out/affected.json") || exit 1
      if [ -z "$SUBJECTS" ]; then echo "shard $CI_NODE_INDEX/$CI_NODE_TOTAL: no affected flagship in this shard (see $out/affected.json)"; exit 0; fi
      xvfb-run -a -s "-screen 0 2880x1800x24" node tests/perf/harness/run-perf.mjs --profile a --scope "$AG_SCOPE" --subjects "$SUBJECTS" --out "$out/perf-results.json" || rc=1
      if [ "$AG_SCOPE" = "pr" ]; then
        node scripts/qual/perf/resolve-budgets.mjs --scope "$AG_SCOPE" || rc=1
        AG_PERF_HEAD_RESULTS="$out/perf-results.json" AG_L10_REPORT=pr-ratchet npx playwright test -c tests/perf/qual/playwright.config.ts --project qual:l10-ratchet || pw=$?
        node scripts/qual/perf/pw-verdict.mjs "$out/playwright-pr-ratchet.json" --scope "$AG_SCOPE" --exit "${pw:-0}" || rc=1
      fi
      exit $rc
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths: [.artifacts/qual/$CI_JOB_NAME_SLUG/]

# Real devices (REQ-QUAL-48, G-25): AWS Device Farm + EC2 mac1.metal Safari, runner instance role only.
# Manual until the auraglass-aws-remote runner and Device Farm project exist (OD-11, OD-5); the self-check runs first
# so a broken runner never reaches AWS. Results JSON is an artifact only; sign-off is
# docs/certification/real-device-matrix.md (REQ-FIN-112, human).
qual:certify:devices:
  # Runs at release scope too, so its evidence follows the release retention (90 days, .artifacts/).
  extends: [.ag-aws-remote, .ag-evidence-release]
  stage: certify
  needs:
    - { job: "qual:build:storybook", artifacts: true, optional: true }
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "main" || $AG_SCOPE == "nightly" || $AG_SCOPE == "release")
      when: manual
      allow_failure: true
  timeout: 3h
  script:
    - node scripts/qual/devices/device-farm-run.mjs --self-check --out .artifacts/qual/$CI_JOB_NAME_SLUG/self-check.json
    # REQ-QUAL-67 / OD-5: Device Farm needs egress; exit 78 if the runner's proxy CA is expired or expires within 7 days.
    - node scripts/qual/remote/preflight.mjs --egress
    - node scripts/qual/devices/device-farm-run.mjs --subjects storybook-static/cert-manifest.json --out .artifacts/qual/$CI_JOB_NAME_SLUG/real-device-results.json

# Release capture matrix (REQ-QUAL-65, G-04). qual:certify:release-plan computes the release cell count (the capture
# driver's plan at release scope, `playwright test --list`, no browser launched) and the shard count from the capture
# rate measured on the lane's runner tag by the last qual:certify:nightly on next (jobs API, CI_JOB_TOKEN; never
# assumed), then writes shards.json + shards.gitlab-ci.yml (`parallel` ≤ 200).
qual:certify:release-plan:
  extends: [.ag-playwright, .ag-evidence-release]
  stage: certify
  needs:
    - { job: "qual:build:storybook", artifacts: true }
  rules:
    - if: $AG_SCOPE == "release" && $AG_LINE == "5x"
  script:
    - >-
      AG_SCOPE=release AG_LANE_EVIDENCE_DIR=.artifacts/qual/$CI_JOB_NAME_SLUG
      node node_modules/@playwright/test/cli.js test -c certification/playwright.cert.config.ts --list --project chromium
      certification/lanes/environment-visual.spec.ts
    - >-
      node scripts/qual/shard-plan.mjs plan --cells-from .artifacts/qual/$CI_JOB_NAME_SLUG/environment-visual/plan.json
      --rates-from-job qual:certify:nightly --rates-ref next --out-dir .artifacts/qual/$CI_JOB_NAME_SLUG
# The trigger of the dynamic child pipeline. GitLab rejects image/tags/cache/before_script/artifacts on a trigger job,
# so it cannot extend a root .ag-* template and contract:ci-fragments rule 2 needs a bridge-job exemption (FIN-B,
# scripts/ci/verify-ci-fragments.mjs). Once that lands this job becomes exactly:
#   qual:certify:release-matrix:
#     stage: certify
#     rules: [{ if: $AG_SCOPE == "release" && $AG_LINE == "5x" }]
#     needs: [{ job: "qual:certify:release-plan", artifacts: true }]
#     variables: { PARENT_PIPELINE_ID: $CI_PIPELINE_ID }
#     trigger:
#       include: [{ artifact: .artifacts/qual/qual-certify-release-plan/shards.gitlab-ci.yml, job: "qual:certify:release-plan" }]
#       strategy: depend
# Until then it fails closed at release scope, so no release passes without its sharded matrix.
qual:certify:release-matrix:
  extends: [.ag-node, .ag-evidence-release]
  stage: certify
  needs:
    - { job: "qual:certify:release-plan", artifacts: true }
  rules:
    - if: $AG_SCOPE == "release" && $AG_LINE == "5x"
  script:
    - test -f .artifacts/qual/qual-certify-release-plan/shards.gitlab-ci.yml
    - 'echo "PENDING: the child-pipeline trigger for the scripts/qual/shard-plan.mjs plan needs the contract:ci-fragments bridge-job exemption (FIN-B); release matrix not run"; exit 1'

# Visual baseline refresh (REQ-QUAL-25, G-14): candidate PNGs + diff report as artifacts, reviewed before commit.
qual:certify:baseline-refresh:
  extends: .ag-playwright
  stage: certify
  needs:
    - { job: "qual:build:storybook", artifacts: true, optional: true }
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main")
      when: manual
      allow_failure: true
  script:
    - 'test -f scripts/qual/baseline-refresh.mjs || { echo "PENDING: scripts/qual/baseline-refresh.mjs (G-14, REQ-QUAL-25) not merged"; exit 1; }'
    - node scripts/qual/baseline-refresh.mjs
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths: [.artifacts/qual/$CI_JOB_NAME_SLUG/]

# Human visual review record (REQ-QUAL-73 / REQ-FIN-111 tooling, G-16). Builds the review composites from the L6/L7
# captures (review-inputs.json) and validates the reviewer's records in certification/review/records/ against
# certification/schemas/review-record.schema.json, the RC SHA and those composites (pass = every criterion >= 3).
# It never writes a record: records are the design reviewer's (FIN-H). Manual on the RC tag pipeline, and on the
# reviewer's records PR (next-fin/h-review-records-<rc>) with AG_RC_SHA set to the RC SHA the records score.
# Both steps always run; the job fails if either fails (no fail-open).
qual:certify:review-record:
  extends: [.ag-node, .ag-evidence-release]
  stage: certify
  needs:
    - { job: "qual:certify:l6", artifacts: true, optional: true }
    - { job: "qual:certify:l7", artifacts: true, optional: true }
    - { job: "qual:certify:release", artifacts: true, optional: true }
  rules:
    - if: $AG_SCOPE == "release" && $AG_LINE == "5x"
      when: manual
      allow_failure: true
    - if: $AG_SCOPE == "pr" && $AG_LINE == "5x" && $CI_COMMIT_REF_NAME =~ /^next-fin\/h-review-records-/
      when: manual
      allow_failure: true
  script:
    - |
      rc=0
      out=".artifacts/qual/$CI_JOB_NAME_SLUG"
      inputs=$(find .artifacts -name review-inputs.json -print -quit)
      if [ -n "$inputs" ]; then
        node --experimental-strip-types scripts/qual/review-record.mjs composites --inputs "$inputs" --out "$out/composites" || rc=1
      else
        echo "review-record: no review-inputs.json from qual:certify:l6/l7 in this pipeline; composites cannot be built"; rc=1
      fi
      composites=""
      if [ -f "$out/composites/index.json" ]; then composites="--composites $out/composites"; fi
      node --experimental-strip-types scripts/qual/review-record.mjs validate --sha "${AG_RC_SHA:-$CI_COMMIT_SHA}" $composites --out "$out/review-record.json" || rc=1
      exit $rc

# REQ-QUAL-32 (G-15, FIN-434): known-failures proof. Checks out tag v4.1.0 into a scratch worktree, builds its Storybook
# there with the 4.1 scripts unchanged, then runs the L6 detectors + the ported 4.x measurement layer on it
# (certification/lanes/known-failures.spec.ts) and the 10 ported detector fixtures (packages/qa/test/inspect.fixtures.test.ts).
# Every expected 4.1 failure must be reported with its gate id; a detector change that drops one fails the job.
# Nightly on next; also on PR pipelines that change a detector, the fixtures, the thresholds or this proof.
# tesseract 5 (OCR gate) is installed in-job until AG_PLAYWRIGHT_IMAGE carries it (FIN-B). Every step runs; non-zero if any failed.
qual:certify:known-failures:
  extends: .ag-playwright
  stage: certify
  allow_failure: true
  needs: []
  timeout: 90m
  variables:
    GIT_DEPTH: "0"
    AG_V410_SHA: "15b6de6f74e66bcaa4e09f6bc2c8e0b5bdaeae07"
    AG_V410_DIR: "/tmp/ag-v4.1.0"
    AG_KNOWN_FAILURES_STORYBOOK: "/tmp/ag-v4.1.0/storybook-static"
  rules:
    - if: $AG_SCOPE == "nightly" && $AG_LINE == "5x"
    - if: $AG_SCOPE == "pr" && $AG_LINE == "5x"
      changes:
        paths:
          - packages/qa/src/inspect/**/*
          - packages/qa/src/ocr/**/*
          - packages/qa/src/pixel/**/*
          - packages/qa/src/evidence/consoleAllowlist.ts
          - packages/qa/fixtures/**/*
          - packages/qa/test/inspect.fixtures.test.ts
          - certification/lanes/known-failures.spec.ts
          - certification/thresholds.json
          - certification/console-allowlist.json
          - ci/qual.gitlab-ci.yml
        compare_to: refs/heads/next
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-eng
    - tesseract --version
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
  script:
    - mkdir -p ".artifacts/qual/$CI_JOB_NAME_SLUG"
    - git fetch --no-tags origin "+refs/tags/v4.1.0:refs/tags/v4.1.0"
    - test "$(git rev-parse 'v4.1.0^{commit}')" = "$AG_V410_SHA"
    - git worktree add --detach "$AG_V410_DIR" v4.1.0
    # --ignore-scripts: 4.1's dev-only native iltorb (via bundlesize) has no prebuilt for this Node and no toolchain here;
    # the Storybook build needs none of the install scripts (esbuild resolves its platform package, protobufjs only
    # prints a version notice). The 4.1 build script itself runs unchanged.
    - (cd "$AG_V410_DIR" && npm ci --ignore-scripts --no-audit --no-fund && NODE_OPTIONS=--max-old-space-size=8192 npm run build-storybook -- -o storybook-static)
    - test -f "$AG_KNOWN_FAILURES_STORYBOOK/index.json"
    - |
      rc=0
      PLAYWRIGHT_JSON_OUTPUT_NAME="$CI_PROJECT_DIR/.artifacts/qual/$CI_JOB_NAME_SLUG/playwright.json" \
        node node_modules/@playwright/test/cli.js test -c certification/playwright.cert.config.ts \
        certification/lanes/known-failures.spec.ts --project chromium || rc=1
      node node_modules/jest/bin/jest.js -c jest.qual.config.js --ci packages/qa/test/inspect.fixtures.test.ts || rc=1
      exit $rc
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 30 days
    paths: [.artifacts/qual/$CI_JOB_NAME_SLUG/]
# REQ-QUAL-07/-08 (G-11, FIN-427/-428): certification scenes. Manifest freshness + integrity + scene stories (node),
# content bands incl. dense-text OCR (tesseract 5 must be in AG_PLAYWRIGHT_IMAGE; image is FIN-B's).
# G-03 folds these into the L12/L6 lane runner; packages/qa tests move under jest.qual.config.js (G-01).
qual:test:scenes:
  extends: .ag-node
  stage: test
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main" || $AG_SCOPE == "nightly" || $AG_SCOPE == "release")
  script:
    - node scripts/qual/scenes/write-manifest.mjs --check
    - npx jest --ci tests/storybook/cert-scenes.test.ts
    - npx jest --ci --testMatch '<rootDir>/packages/qa/test/scenes-manifest.test.ts' --testPathIgnorePatterns /node_modules/
qual:test:scene-bands:
  extends: .ag-playwright
  stage: test
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main" || $AG_SCOPE == "nightly" || $AG_SCOPE == "release")
  script:
    - command -v tesseract >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-eng)
    - node_modules/.bin/jest --ci tests/storybook/scene-bands.test.mjs

qual:certify:baseline-refresh:
  extends: .ag-playwright
  stage: certify
  allow_failure: true
  needs:
    - { job: "qual:build:storybook", artifacts: true, optional: true }
  variables:
    AG_STORYBOOK_URL: "http://127.0.0.1:6006"
  rules:
    - if: $AG_LINE == "5x" && $AG_SCOPE == "nightly"
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main")
      when: manual
  script:
    - node scripts/qual/serve-static.mjs storybook-static 6006 &
    - node scripts/qual/baseline-refresh.mjs --out ".artifacts/qual/$CI_JOB_NAME_SLUG"
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 30 days
    paths: [".artifacts/qual/$CI_JOB_NAME_SLUG/"]

qual:certify:perf-grade:
  extends: .qual-node-lane
  variables: { GIT_DEPTH: "0" }
  needs:
    - { job: "qual:certify:l10", artifacts: true, optional: true }
    - { job: "qual:certify:l10-gpu", artifacts: true, optional: true }
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "main" || $AG_SCOPE == "nightly" || $AG_SCOPE == "release")
  script:
    - git fetch --no-tags --tags origin
    - node scripts/qual/perf/resolve-budgets.mjs --scope "$AG_SCOPE"
    - node scripts/qual/perf/grade.mjs --scope "$AG_SCOPE" --results ".artifacts/qual/qual-certify-l10/perf-results.json,.artifacts/qual/qual-certify-l10-gpu-*/perf-results.json"
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths: [.artifacts/qual/perf-report.json, .artifacts/qual/$CI_JOB_NAME_SLUG/]

qual:a11y:harness-selftest:
  extends: .ag-playwright
  stage: certify
  allow_failure: true
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main")
  variables: { PLAYWRIGHT_JSON_OUTPUT_NAME: ".artifacts/qual/$CI_JOB_NAME_SLUG/selftest.json" }
  script:
    - mkdir -p ".artifacts/qual/$CI_JOB_NAME_SLUG"
    - 'node node_modules/@playwright/test/cli.js test -c certification/playwright.cert.config.ts --list tests/a11y/apg tests/e2e > ".artifacts/qual/$CI_JOB_NAME_SLUG/cert-list.txt"'
    - 'for p in cmp mat surf; do for k in apg e2e; do for e in chromium webkit firefox; do grep -q "\[$p:loc-$k-$e\]" ".artifacts/qual/$CI_JOB_NAME_SLUG/cert-list.txt" || { echo "missing project $p:loc-$k-$e in --list"; exit 1; }; done; done; done'
    - node node_modules/@playwright/test/cli.js test -c certification/playwright.cert.config.ts tests/a11y/browser/__selftest__/
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths: [.artifacts/qual/$CI_JOB_NAME_SLUG/]
