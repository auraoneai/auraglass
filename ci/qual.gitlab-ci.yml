# ci/qual.gitlab-ci.yml (QUAL), seed: Storybook build and the lane matrix. Real lanes report pending until registered.
# REQ-QUAL-56/-57 (FIN-452): qual:build:storybook is dist-backed (AG_STORYBOOK_DIST=1, dist/ from the optional
# plat:build:dist artifact, else `npm run build`), checked by check-build-log.mjs and stamped with ag-build.json.
# Every consumer of the built Storybook runs verify-fresh.mjs first.
.qual-lane:
  extends: .ag-playwright
  stage: certify
  allow_failure: true
  needs:
    - { job: "qual:build:storybook", artifacts: true, optional: true }
    - { job: "plat:package:pack", artifacts: true, optional: true }
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main")
  script:
    - node scripts/storybook/verify-fresh.mjs --dir storybook-static
    - node certification/run.mjs --lane "$LANE" --scope "$AG_SCOPE"
qual:build:storybook:
  extends: .ag-node
  stage: build
  allow_failure: true
  needs:
    - { job: "plat:build:dist", artifacts: true, optional: true }
  rules:
    - if: $AG_LINE == "5x"
  script:
    # REQ-QUAL-09..11 / REQ-FIN-106: preview, StoryRoot readiness and determinism unit tests gate the build
    - npx jest --ci tests/storybook
    # REQ-QUAL-56: dist from plat:build:dist (else npm run build), then AG_STORYBOOK_DIST=1 storybook build
    - node scripts/storybook/build.mjs
    - node scripts/storybook/check-build-log.mjs --dir storybook-static
    - node scripts/storybook/write-build-manifest.mjs --dir storybook-static
    - node scripts/storybook/verify-fresh.mjs --dir storybook-static
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths: [storybook-static/, .artifacts/qual/$CI_JOB_NAME_SLUG/]
qual:test:storybook-flows:
  # REQ-QUAL-57: S1 showcase primary-task flows + Lab control round-trips against the fresh built Storybook
  extends: .ag-playwright
  stage: test
  allow_failure: true
  needs:
    - { job: "qual:build:storybook", artifacts: true }
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main")
  script:
    - AURAGLASS_EVIDENCE_DIR=".artifacts/qual/$CI_JOB_NAME_SLUG" node scripts/storybook/run-flows.mjs --dir storybook-static -- --output ".artifacts/qual/$CI_JOB_NAME_SLUG/test-results"
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths: [.artifacts/qual/$CI_JOB_NAME_SLUG/]
qual:certify:l1:
  extends: .qual-lane
  variables: { LANE: L1 }
  script:
    # REQ-QUAL-56: story typecheck is part of L1
    - node_modules/.bin/tsc --noEmit -p tsconfig.storybook.json
    - node certification/run.mjs --lane "$LANE" --scope "$AG_SCOPE"
# ... one job per lane L1..L12, named exactly as CERT_JOBS ...
qual:certify:nightly:
  extends: .qual-lane
  rules: [{ if: $AG_SCOPE == "nightly" }]
  script:
    - node scripts/storybook/verify-fresh.mjs --dir storybook-static
    - node certification/run.mjs --lane all --scope nightly
qual:certify:release:
  extends: [.qual-lane, .ag-evidence-release]
  rules: [{ if: $AG_SCOPE == "release" && $AG_LINE == "5x" }]
  script:
    - node scripts/storybook/verify-fresh.mjs --dir storybook-static
    - node certification/run.mjs --lane all --scope release --verdict .artifacts/qual/release-verdict.json
