# ci/qual.gitlab-ci.yml (QUAL), seed: Storybook build and the lane matrix. Real lanes report pending until registered.
.qual-lane:
  extends: .ag-playwright
  stage: certify
  allow_failure: true
  needs:
    - { job: "qual:build:storybook", artifacts: true, optional: true }
    - { job: "plat:package:pack", artifacts: true, optional: true }
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main")
  script:
    - node certification/run.mjs --lane "$LANE" --scope "$AG_SCOPE"
qual:build:storybook:
  extends: .ag-node
  stage: build
  allow_failure: true
  rules:
    - if: $AG_LINE == "5x"
  script:
    - npm run storybook:build
  artifacts:
    name: "storybook-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    paths: [storybook-static/]
qual:certify:l1:  { extends: .qual-lane, variables: { LANE: L1 } }
# ... one job per lane L1..L12, named exactly as CERT_JOBS ...
qual:certify:nightly:
  extends: .qual-lane
  rules: [{ if: $AG_SCOPE == "nightly" }]
  script: [node certification/run.mjs --lane all --scope nightly]
qual:certify:release:
  extends: [.qual-lane, .ag-evidence-release]
  rules: [{ if: $AG_SCOPE == "release" && $AG_LINE == "5x" }]
  script: [node certification/run.mjs --lane all --scope release --verdict .artifacts/qual/release-verdict.json]
# REQ-QUAL-32 (G-15, FIN-434): known-failures proof. Checks out tag v4.1.0 into a scratch worktree, builds its Storybook
# there with the 4.1 scripts unchanged, then runs the L6 detectors + the ported 4.x measurement layer on it
# (certification/lanes/known-failures.spec.ts) and the 10 ported detector fixtures (packages/qa/test/inspect.fixtures.test.ts).
# Every expected 4.1 failure must be reported with its gate id; a detector change that drops one fails the job.
# Nightly on next; also on PR pipelines that change a detector, the fixtures, the thresholds or this proof.
# tesseract 5 (OCR gate) is installed in-job until AG_PLAYWRIGHT_IMAGE carries it (FIN-B). Every step runs; non-zero if any failed.
qual:certify:known-failures:
  extends: .ag-playwright
  stage: certify
  allow_failure: true
  needs: []
  timeout: 90m
  variables:
    GIT_DEPTH: "0"
    AG_V410_SHA: "15b6de6f74e66bcaa4e09f6bc2c8e0b5bdaeae07"
    AG_V410_DIR: "/tmp/ag-v4.1.0"
    AG_KNOWN_FAILURES_STORYBOOK: "/tmp/ag-v4.1.0/storybook-static"
  rules:
    - if: $AG_SCOPE == "nightly" && $AG_LINE == "5x"
    - if: $AG_SCOPE == "pr" && $AG_LINE == "5x"
      changes:
        paths:
          - packages/qa/src/inspect/**/*
          - packages/qa/src/ocr/**/*
          - packages/qa/src/pixel/**/*
          - packages/qa/src/evidence/consoleAllowlist.ts
          - packages/qa/fixtures/**/*
          - packages/qa/test/inspect.fixtures.test.ts
          - certification/lanes/known-failures.spec.ts
          - certification/thresholds.json
          - certification/console-allowlist.json
          - ci/qual.gitlab-ci.yml
        compare_to: refs/heads/next
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-eng
    - tesseract --version
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
  script:
    - mkdir -p ".artifacts/qual/$CI_JOB_NAME_SLUG"
    - git fetch --no-tags origin "+refs/tags/v4.1.0:refs/tags/v4.1.0"
    - test "$(git rev-parse 'v4.1.0^{commit}')" = "$AG_V410_SHA"
    - git worktree add --detach "$AG_V410_DIR" v4.1.0
    - (cd "$AG_V410_DIR" && HUSKY=0 npm ci --no-audit --no-fund && NODE_OPTIONS=--max-old-space-size=8192 npm run build-storybook -- -o storybook-static)
    - test -f "$AG_KNOWN_FAILURES_STORYBOOK/index.json"
    - |
      rc=0
      PLAYWRIGHT_JSON_OUTPUT_NAME="$CI_PROJECT_DIR/.artifacts/qual/$CI_JOB_NAME_SLUG/playwright.json" \
        node node_modules/@playwright/test/cli.js test -c certification/playwright.cert.config.ts \
        certification/lanes/known-failures.spec.ts --project chromium || rc=1
      node node_modules/jest/bin/jest.js -c jest.qual.config.js --ci packages/qa/test/inspect.fixtures.test.ts || rc=1
      exit $rc
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 30 days
    paths: [.artifacts/qual/$CI_JOB_NAME_SLUG/]
