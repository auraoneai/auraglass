# ci/qual.gitlab-ci.yml (QUAL). Storybook build and the lane matrix. Lanes run through
# certification/run.mjs (REQ-QUAL-05, G-03); until the runner lands, L1 runs the @auraglass/qa unit
# suite and the inventory gate directly. Evidence is GitLab job artifacts only (REQ-QUAL-60, S-48):
# every job names its artifact evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA, writes under
# .artifacts/qual/$CI_JOB_NAME_SLUG/ and expires per EVIDENCE.expireIn (pr/main 14 days,
# nightly 30 days, release 90 days via .ag-evidence-release).
.qual-lane:
  extends: .ag-playwright
  stage: certify
  allow_failure: true
  needs:
    - { job: "qual:build:storybook", artifacts: true, optional: true }
    - { job: "plat:package:pack", artifacts: true, optional: true }
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main")
  script:
    - node certification/run.mjs --lane "$LANE" --scope "$AG_SCOPE"
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths: [.artifacts/qual/$CI_JOB_NAME_SLUG/]
.qual-node-lane:
  extends: .ag-node
  stage: certify
  allow_failure: true
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main")
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths: [.artifacts/qual/$CI_JOB_NAME_SLUG/]
qual:build:storybook:
  extends: .ag-node
  stage: build
  allow_failure: true
  rules:
    - if: $AG_LINE == "5x"
  script:
    - npm run storybook:build
    # REQ-QUAL-01: SubjectIndex (REPORTS.subjects) from index.json + parameters.ag; fails on mismatch.
    - node --experimental-strip-types scripts/storybook/write-cert-manifest.mjs --dir storybook-static
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths: [storybook-static/]
qual:certify:l1:
  extends: .qual-node-lane
  variables: { LANE: L1 }
  script:
    # REQ-QUAL-01/-02/-03/-60: @auraglass/qa unit suite incl. the tracked-evidence guard.
    - node node_modules/jest/bin/jest.js -c jest.qual.config.js --ci
    # REQ-QUAL-02: inventory gate over ENTRIES; writes .artifacts/qual/$CI_JOB_NAME_SLUG/inventory.json.
    - node --experimental-strip-types scripts/qual/write-inventory.mjs
# ... one job per lane L2..L12, named exactly as CERT_JOBS (REQ-QUAL-05, G-03) ...
qual:certify:nightly:
  extends: .qual-lane
  rules: [{ if: $AG_SCOPE == "nightly" }]
  script: [node certification/run.mjs --lane all --scope nightly]
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 30 days
    paths: [.artifacts/qual/$CI_JOB_NAME_SLUG/]
qual:certify:release:
  extends: [.qual-lane, .ag-evidence-release]
  allow_failure: false
  rules: [{ if: $AG_SCOPE == "release" && $AG_LINE == "5x" }]
  script: [node certification/run.mjs --lane all --scope release --verdict .artifacts/qual/release-verdict.json]
