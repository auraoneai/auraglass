# ci/qual.gitlab-ci.yml (QUAL), seed: Storybook build and the lane matrix. Real lanes report pending until registered.
.qual-lane:
  extends: .ag-playwright
  stage: certify
  allow_failure: true
  needs:
    - { job: "qual:build:storybook", artifacts: true, optional: true }
    - { job: "plat:package:pack", artifacts: true, optional: true }
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main")
  script:
    - node certification/run.mjs --lane "$LANE" --scope "$AG_SCOPE"
qual:build:storybook:
  extends: .ag-node
  stage: build
  allow_failure: true
  rules:
    - if: $AG_LINE == "5x"
  script:
    - npm run storybook:build
  artifacts:
    name: "storybook-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    paths: [storybook-static/]
qual:certify:l1:  { extends: .qual-lane, variables: { LANE: L1 } }
# ... one job per lane L1..L12, named exactly as CERT_JOBS ...
# REQ-QUAL-19/-20 (G-17): APG harness self-test in chromium/webkit/firefox (fixture page, no Storybook) and the
# cert-config listing that proves tests/a11y/apg/<stream>/** and tests/e2e/<stream>/** are discovered in 3 engines.
qual:a11y:harness-selftest:
  extends: .ag-playwright
  stage: certify
  allow_failure: true
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main")
  variables: { PLAYWRIGHT_JSON_OUTPUT_NAME: ".artifacts/qual/$CI_JOB_NAME_SLUG/selftest.json" }
  script:
    - mkdir -p ".artifacts/qual/$CI_JOB_NAME_SLUG"
    - 'node node_modules/@playwright/test/cli.js test -c certification/playwright.cert.config.ts --list tests/a11y/apg tests/e2e > ".artifacts/qual/$CI_JOB_NAME_SLUG/cert-list.txt"'
    - 'for p in cmp mat surf; do for k in apg e2e; do for e in chromium webkit firefox; do grep -q "\[$p:loc-$k-$e\]" ".artifacts/qual/$CI_JOB_NAME_SLUG/cert-list.txt" || { echo "missing project $p:loc-$k-$e in --list"; exit 1; }; done; done; done'
    - node node_modules/@playwright/test/cli.js test -c certification/playwright.cert.config.ts tests/a11y/browser/__selftest__/
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths: [.artifacts/qual/$CI_JOB_NAME_SLUG/]
qual:certify:nightly:
  extends: .qual-lane
  rules: [{ if: $AG_SCOPE == "nightly" }]
  script: [node certification/run.mjs --lane all --scope nightly]
qual:certify:release:
  extends: [.qual-lane, .ag-evidence-release]
  rules: [{ if: $AG_SCOPE == "release" && $AG_LINE == "5x" }]
  script: [node certification/run.mjs --lane all --scope release --verdict .artifacts/qual/release-verdict.json]
