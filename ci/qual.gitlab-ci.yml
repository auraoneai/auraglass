# ci/qual.gitlab-ci.yml (QUAL). Storybook build and the lane matrix. Lanes run through
# certification/run.mjs (REQ-QUAL-05, G-03); until the runner lands, L1 runs the @auraglass/qa unit
# suite and the inventory gate directly. Evidence is GitLab job artifacts only (REQ-QUAL-60, S-48):
# every job names its artifact evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA, writes under
# .artifacts/qual/$CI_JOB_NAME_SLUG/ and expires per EVIDENCE.expireIn (pr/main 14 days,
# nightly 30 days, release 90 days via .ag-evidence-release).
.qual-lane:
  extends: .ag-playwright
  stage: certify
  allow_failure: true
  needs:
    - { job: "qual:build:storybook", artifacts: true, optional: true }
    - { job: "plat:package:pack", artifacts: true, optional: true }
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main")
  script:
    - node certification/run.mjs --lane "$LANE" --scope "$AG_SCOPE"
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths: [.artifacts/qual/$CI_JOB_NAME_SLUG/]
.qual-node-lane:
  extends: .ag-node
  stage: certify
  allow_failure: true
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main")
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths: [.artifacts/qual/$CI_JOB_NAME_SLUG/]
qual:build:storybook:
  extends: .ag-node
  stage: build
  allow_failure: true
  rules:
    - if: $AG_LINE == "5x"
  script:
    # REQ-QUAL-09..11 / REQ-FIN-106: preview, StoryRoot readiness and determinism unit tests gate the build
    - npx jest --ci tests/storybook
    - npm run storybook:build
    # REQ-QUAL-01: SubjectIndex (REPORTS.subjects) from index.json + parameters.ag; fails on mismatch.
    - node --experimental-strip-types scripts/storybook/write-cert-manifest.mjs --dir storybook-static
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths: [storybook-static/]
qual:certify:l1:
  extends: .qual-node-lane
  variables: { LANE: L1 }
  script:
    # REQ-QUAL-01/-02/-03/-60: @auraglass/qa unit suite incl. the tracked-evidence guard.
    - node node_modules/jest/bin/jest.js -c jest.qual.config.js --ci
    # REQ-QUAL-02: inventory gate over ENTRIES; writes .artifacts/qual/$CI_JOB_NAME_SLUG/inventory.json.
    - node --experimental-strip-types scripts/qual/write-inventory.mjs
# ... one job per lane L2..L12, named exactly as CERT_JOBS (REQ-QUAL-05, G-03) ...
# L10 Performance (REQ-QUAL-34..36). Profiles b, c, d on .ag-playwright; profile a on .ag-gpu (qual:certify:l10-gpu).
# Every step runs; the job exits non-zero if any step failed (no fail-open). allow_failure flips through ci/plat/activation.json.
qual:certify:l10:
  extends: .qual-lane
  variables: { LANE: L10, AG_STORYBOOK_STATIC: "$CI_PROJECT_DIR/storybook-static" }
  timeout: 90m
  # Build-stage inputs only (Storybook + dist for bundle bytes), so L10 is not skipped behind package-stage jobs.
  needs: &qual-l10-needs
    - { job: "qual:build:storybook", artifacts: true, optional: true }
    - { job: "plat:build:dist", artifacts: true, optional: true }
  script:
    - |
      rc=0
      node node_modules/jest/bin/jest.js --ci --testPathIgnorePatterns /node_modules/ \
        --testMatch '**/packages/qa/test/bci.test.ts' '**/tests/perf/qual/run-perf.test.mjs' '**/tests/storybook/perf-fixtures-index.test.mjs' \
        '**/tests/perf/qual/invariants.test.mjs' || rc=1
      npx playwright test -c tests/perf/qual/playwright.config.ts --project qual:l10-selftest || rc=1
      node tests/perf/harness/run-perf.mjs --profile b,c,d --scope "$AG_SCOPE" || rc=1
      AG_L10_STREAMS=1 npx playwright test -c tests/perf/qual/playwright.config.ts --project qual:l10-streams || rc=1
      # REQ-QUAL-42/-43 invariants (G-22): leak (Chromium) + backdrop root, lens defs, WebGL, a11y fallback (3 engines).
      AG_L10_INVARIANTS=1 npx playwright test -c tests/perf/qual/playwright.config.ts \
        --project qual:l10-invariants-chromium --project qual:l10-invariants-webkit --project qual:l10-invariants-firefox || rc=1
      exit $rc
qual:certify:l10-gpu:
  extends: [.qual-lane, .ag-gpu]
  variables:
    LANE: L10
    # Ask the NVIDIA container runtime for the graphics/display userspace. With the stock Playwright image no NVIDIA
    # userspace is present (nvidia-smi missing; Chromium lands on llvmpipe/SwiftShader), and run-perf.mjs fails profile
    # (a) with software-compositing/software-raster until the runner image carries the drivers (infra item, G-20 PR).
    NVIDIA_VISIBLE_DEVICES: "all"
    NVIDIA_DRIVER_CAPABILITIES: "all"
  timeout: 90m
  needs: *qual-l10-needs
  rules:
    - if: $AG_LINE == "5x" && $AG_SCOPE == "main"
    - if: $AG_LINE == "5x" && $AG_SCOPE == "pr"
      changes: [src/**/*, tests/perf/harness/**/*, stories/qual/perf/**/*, packages/qa/src/perf/**/*, ci/qual.gitlab-ci.yml]
  script:
    - if command -v nvidia-smi >/dev/null; then nvidia-smi -L; else echo "nvidia-smi not present in $AG_PLAYWRIGHT_IMAGE"; fi
    - xvfb-run -a -s "-screen 0 2880x1800x24" node tests/perf/harness/run-perf.mjs --profile a --scope "$AG_SCOPE"
qual:certify:nightly:
  extends: .qual-lane
  rules: [{ if: $AG_SCOPE == "nightly" }]
  script: [node certification/run.mjs --lane all --scope nightly]
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 30 days
    paths: [.artifacts/qual/$CI_JOB_NAME_SLUG/]
qual:certify:release:
  extends: [.qual-lane, .ag-evidence-release]
  allow_failure: false
  rules: [{ if: $AG_SCOPE == "release" && $AG_LINE == "5x" }]
  script: [node certification/run.mjs --lane all --scope release --verdict .artifacts/qual/release-verdict.json]
# REQ-QUAL-32 (G-15, FIN-434): known-failures proof. Checks out tag v4.1.0 into a scratch worktree, builds its Storybook
# there with the 4.1 scripts unchanged, then runs the L6 detectors + the ported 4.x measurement layer on it
# (certification/lanes/known-failures.spec.ts) and the 10 ported detector fixtures (packages/qa/test/inspect.fixtures.test.ts).
# Every expected 4.1 failure must be reported with its gate id; a detector change that drops one fails the job.
# Nightly on next; also on PR pipelines that change a detector, the fixtures, the thresholds or this proof.
# tesseract 5 (OCR gate) is installed in-job until AG_PLAYWRIGHT_IMAGE carries it (FIN-B). Every step runs; non-zero if any failed.
qual:certify:known-failures:
  extends: .ag-playwright
  stage: certify
  allow_failure: true
  needs: []
  timeout: 90m
  variables:
    GIT_DEPTH: "0"
    AG_V410_SHA: "15b6de6f74e66bcaa4e09f6bc2c8e0b5bdaeae07"
    AG_V410_DIR: "/tmp/ag-v4.1.0"
    AG_KNOWN_FAILURES_STORYBOOK: "/tmp/ag-v4.1.0/storybook-static"
  rules:
    - if: $AG_SCOPE == "nightly" && $AG_LINE == "5x"
    - if: $AG_SCOPE == "pr" && $AG_LINE == "5x"
      changes:
        paths:
          - packages/qa/src/inspect/**/*
          - packages/qa/src/ocr/**/*
          - packages/qa/src/pixel/**/*
          - packages/qa/src/evidence/consoleAllowlist.ts
          - packages/qa/fixtures/**/*
          - packages/qa/test/inspect.fixtures.test.ts
          - certification/lanes/known-failures.spec.ts
          - certification/thresholds.json
          - certification/console-allowlist.json
          - ci/qual.gitlab-ci.yml
        compare_to: refs/heads/next
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-eng
    - tesseract --version
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
  script:
    - mkdir -p ".artifacts/qual/$CI_JOB_NAME_SLUG"
    - git fetch --no-tags origin "+refs/tags/v4.1.0:refs/tags/v4.1.0"
    - test "$(git rev-parse 'v4.1.0^{commit}')" = "$AG_V410_SHA"
    - git worktree add --detach "$AG_V410_DIR" v4.1.0
    # --ignore-scripts: 4.1's dev-only native iltorb (via bundlesize) has no prebuilt for this Node and no toolchain here;
    # the Storybook build needs none of the install scripts (esbuild resolves its platform package, protobufjs only
    # prints a version notice). The 4.1 build script itself runs unchanged.
    - (cd "$AG_V410_DIR" && npm ci --ignore-scripts --no-audit --no-fund && NODE_OPTIONS=--max-old-space-size=8192 npm run build-storybook -- -o storybook-static)
    - test -f "$AG_KNOWN_FAILURES_STORYBOOK/index.json"
    - |
      rc=0
      PLAYWRIGHT_JSON_OUTPUT_NAME="$CI_PROJECT_DIR/.artifacts/qual/$CI_JOB_NAME_SLUG/playwright.json" \
        node node_modules/@playwright/test/cli.js test -c certification/playwright.cert.config.ts \
        certification/lanes/known-failures.spec.ts --project chromium || rc=1
      node node_modules/jest/bin/jest.js -c jest.qual.config.js --ci packages/qa/test/inspect.fixtures.test.ts || rc=1
      exit $rc
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 30 days
    paths: [.artifacts/qual/$CI_JOB_NAME_SLUG/]
# QUAL-only self-tests (REQ-QUAL-64). Offline; starts allow_failure: true until its first green run on next (contract §2.3).
qual:test:selftest:
  extends: .ag-node
  stage: test
  allow_failure: true
  needs: [] # offline, consumes no artifacts: start at once instead of waiting for the build stage
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main" || $AG_SCOPE == "nightly")
  script:
    - node scripts/qual/devices/device-farm-run.mjs --self-check --out .artifacts/qual/devices/self-check.json
    - npx jest --ci tests/perf/qual/device-farm-self-check.test.mjs
# Real devices (REQ-QUAL-48): AWS Device Farm + EC2 mac1.metal Safari, runner instance role only.
# Manual until the auraglass-aws-remote runner and Device Farm project exist (OD-11, OD-5); the
# self-check runs first so a broken runner never reaches AWS. Results JSON is an artifact only;
# sign-off is docs/certification/real-device-matrix.md (REQ-FIN-112, human).
qual:certify:devices:
  extends: .ag-aws-remote
  stage: certify
  needs:
    - { job: "qual:build:storybook", artifacts: true, optional: true }
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "main" || $AG_SCOPE == "nightly" || $AG_SCOPE == "release")
      when: manual
      allow_failure: true
  timeout: 3h
  script:
    - node scripts/qual/devices/device-farm-run.mjs --self-check --out .artifacts/qual/devices/self-check.json
    - node scripts/qual/devices/device-farm-run.mjs --subjects storybook-static/cert-manifest.json --out .artifacts/qual/devices/real-device-results.json
# REQ-QUAL-07/-08 (G-11, FIN-427/-428): certification scenes. Manifest freshness + integrity + scene stories (node),
# content bands incl. dense-text OCR (tesseract 5 must be in AG_PLAYWRIGHT_IMAGE; image is FIN-B's).
# G-03 folds these into the L12/L6 lane runner; packages/qa tests move under jest.qual.config.js (G-01).
qual:test:scenes:
  extends: .ag-node
  stage: test
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main" || $AG_SCOPE == "nightly" || $AG_SCOPE == "release")
  script:
    - node scripts/qual/scenes/write-manifest.mjs --check
    - npx jest --ci tests/storybook/cert-scenes.test.ts
    - npx jest --ci --testMatch '<rootDir>/packages/qa/test/scenes-manifest.test.ts' --testPathIgnorePatterns /node_modules/
qual:test:scene-bands:
  extends: .ag-playwright
  stage: test
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main" || $AG_SCOPE == "nightly" || $AG_SCOPE == "release")
  script:
    - npx jest --ci tests/storybook/scene-bands.test.mjs
