# ci/cmp.gitlab-ci.yml (CMP). Lane mapping: L1 Static (SC-29). 5x-line jobs only;
# public/private handling per ci-selection.md; no cloud secrets.
.cmp-base:
  extends: .ag-node

cmp:test:foundation-pattern:
  extends: .cmp-base
  stage: test
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main")
  script:
    - npm ci
    - |
      # FND rules auraglass/require-data-ag-part + auraglass/no-forward-ref are in
      # lint/rules/cmp/ agConfig; consumed rules (no-random-in-render PKG-086,
      # no-raw-design-values DS/SC-17, no-optics-outside-material MAT-004) attach
      # through their own owners' agConfig when those lanes land.
      npx eslint src/components src/primitives src/foundation --max-warnings 0
    - node scripts/cmp/verify-foundation-pattern.mjs
    - npm test -- tests/lint tests/foundation src/foundation src/components/field src/components/text-field src/components/search-field src/components/number-field src/components/checkbox src/components/radio-group src/components/switch src/components/slider tests/controls
    - npx tsc -p tests/types/cmp/tsconfig.json --noEmit
    - |
      # gen-component-docs --check (CMP-046): scripts/docs/ is PLAT-owned and the
      # script is not yet delivered — fail loudly rather than skip it.
      if [ -f scripts/docs/gen-component-docs.mjs ]; then
        node scripts/docs/gen-component-docs.mjs --check
      else
        echo "gen-component-docs.mjs missing (CMP-046 pending/PLAT-owned path)"
        exit 1
      fi

cmp:build:dts:
  extends: .cmp-base
  stage: build
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main")
  script:
    - npm ci
    - npm run build
    - npm test -- tests/foundation/exports/no-foundation-types.test.ts
      # REQ-CMP-01: same contract against the packed tarball's dist/, not the
      # build tree — the tarball is what consumers' tsc actually resolves.
    - mkdir -p .artifacts/cmp/dts/pkg
    - npm pack --ignore-scripts --pack-destination .artifacts/cmp/dts
    - tar -xzf .artifacts/cmp/dts/*.tgz -C .artifacts/cmp/dts/pkg
    - AG_DTS_DIR="$PWD/.artifacts/cmp/dts/pkg/package/dist" npm test -- tests/foundation/exports/no-foundation-types.test.ts

# REQ-CMP-135 always-on half: run `migrate 4to5` over the frozen consumer-4x cmp
# cases and assert 0 TODO(aura-glass 5) markers on mechanically mappable props.
# The jest file tests/dx/consumer-4x-cmp.test.ts is FIN-C's (tests/dx/**) and
# lands through FIN-C's hand-off PR; until then this job fails with "no tests
# found" — allow_failure stays true only until its first green run (activation
# row in ci/plat/activation.json, FIN-B).
cmp:test:consumer-4x:
  extends: .cmp-base
  stage: test
  allow_failure: true
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main")
  script:
    - node packages/cli/scripts/gen-mappings.mjs
    - npx jest tests/dx/consumer-4x-cmp.test.ts
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    paths: [.artifacts/]
    when: always

# REQ-CMP-135 remote L11 leg: the cases compile inside a release/4.x worktree;
# `migrate 4to5` then runs on this line and the migrated files type-check with
# 0 TODOs on mappable props. Runs on the gated AWS remote runner (OD-11,
# .ag-aws-remote extends .ag-playwright); manual until the owner registers it.
# No credentials beyond the runner's own (the script only fetches origin).
cmp:remote:consumer-4x:
  extends: .ag-aws-remote
  stage: certify
  rules:
    - if: $AG_LINE == "5x" && $AG_SCOPE != "release"
      when: manual
      allow_failure: true
  script:
    - node scripts/cmp/consumer-4x-l11.mjs
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    paths: [.artifacts/cmp/consumer-4x/]
    when: always
