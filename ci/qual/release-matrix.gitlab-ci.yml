# ci/qual/release-matrix.gitlab-ci.yml (QUAL, REQ-QUAL-65) — child pipeline of qual:certify:release-matrix.
# The release capture matrix is sharded by scripts/qual/shard-plan.mjs (G-04), which generates
# .artifacts/qual/shards.gitlab-ci.yml from the measured capture rate and replaces this static child.
# Until the planner lands this child fails closed, so a release can never pass without its sharded matrix.
stages: [certify]

qual:certify:release-matrix:pending:
  stage: certify
  image: $AG_NODE_IMAGE   # forwarded from the parent pipeline's global variables (trigger forward: yaml_variables)
  tags: [saas-linux-medium-amd64]
  script:
    - 'test -f scripts/qual/shard-plan.mjs || { echo "PENDING: scripts/qual/shard-plan.mjs (G-04, REQ-QUAL-65) not merged; the release matrix cannot be sharded"; exit 1; }'
    - echo "scripts/qual/shard-plan.mjs exists - qual:certify:release-matrix must include its generated child (G-04)"
    - exit 1
