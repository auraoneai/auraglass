# ci/plat.gitlab-ci.yml (PLAT). Full §4.2 job set over the §4.13.3 root.
# Job names are frozen (CI_JOBS/REQUIRED_JOBS, §4.9). Every job is scoped by
# $AG_SCOPE and, where line-specific, $AG_LINE. Missing entry points make the
# job print PENDING and exit non-zero while the job is allow_failure: true
# (§4.13.4 rule 6); the four REQUIRED_JOBS gates flip to allow_failure: false
# per line once ci/plat/activation.json records a first green run (PLAT-015).
.plat-node:
  extends: .ag-node

.plat-playwright:
  extends: .ag-playwright

.plat-release:
  extends: [.plat-node, .ag-evidence-release]

# ---------------------------------------------------------------- build

plat:build:dist:
  extends: .plat-node
  stage: build
  allow_failure: true
  rules:
    - if: $AG_SCOPE == "pr" || $AG_SCOPE == "main" || $AG_SCOPE == "release"
  script:
    - npm run build
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths: [dist/, workers/, .artifacts/plat/]

# ---------------------------------------------------------------- test

plat:gate:glass-quality:
  extends: .plat-node
  stage: test
  allow_failure: true # PLAT-015: remove per line once activation.json records first green run
  rules:
    - if: $CI_COMMIT_TAG
      allow_failure: false
    - if: $AG_SCOPE == "pr" || $AG_SCOPE == "main" || $AG_SCOPE == "release"
  script:
    - npm run typecheck
    - |
      if [ "$AG_LINE" = "4x" ]; then
        npm run lint:check
        npx jest --ci
        npm run verify:css-vars
        for s in verify-tree-hygiene.js verify-docs-claims.js verify-import-side-effects.js; do
          if [ -f "scripts/ci/$s" ]; then node "scripts/ci/$s"; else echo "PENDING: scripts/ci/$s"; exit 1; fi
        done
      else
        npm run lint
        DIRS=""; for d in build exports deps pack side-effects react19 css release ci docs dx registry compat deprecations removal; do
          [ -d "tests/$d" ] && DIRS="$DIRS tests/$d"
        done
        for d in rsc lint types; do [ -d "tests/$d/plat" ] && DIRS="$DIRS tests/$d/plat"; done
        if [ -z "$DIRS" ]; then echo "PENDING: no PLAT test dirs on 5x yet"; exit 1; fi
        npm test -- --ci $DIRS
        for s in artifact:publint artifact:attw; do
          node -e "process.exit(Object.keys(require('./package.json').scripts||{}).includes(process.argv[1])?0:1)" "$s" \
            || { echo "PENDING: npm script $s"; exit 1; }
          npm run "$s"
        done
        for s in verify-size-budgets.mjs verify-deps.mjs verify-side-effects.mjs; do
          [ -f "scripts/ci/$s" ] || { echo "PENDING: scripts/ci/$s"; exit 1; }
          node "scripts/ci/$s"
        done
      fi

plat:test:pack-matrix:
  extends: .plat-node
  stage: test
  allow_failure: true
  timeout: 45 minutes
  image: "$AG_PACK_NODE_IMAGE"
  rules:
    - if: $AG_LINE == "4x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main")
  parallel:
    matrix:
      - { AG_PACK_NODE_IMAGE: "node:20-bookworm", AG_PACK_NPM_VERSION: "10.9.4" }
      - { AG_PACK_NODE_IMAGE: "node:24-bookworm", AG_PACK_NPM_VERSION: "11.21.0" }
  script:
    - npm install -g "npm@$AG_PACK_NPM_VERSION"
    - npm --version
    # prepublishOnly = require-ci-publish guard (exits 1 outside plat:publish:npm, REQ-PLAT-12)
    # + prepublish:verify. The matrix runs the verify half on each node/npm leg, then a
    # dry-run publish with lifecycle scripts skipped (the guard would refuse this job).
    - npm run prepublish:verify
    - npm publish --dry-run --ignore-scripts

plat:test:react19:
  extends: .plat-node
  stage: test
  allow_failure: true
  rules:
    - if: $AG_LINE == "4x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main")
  parallel:
    matrix:
      - { AG_REACT19_LEG: "react19-smoke" }
      - { AG_REACT19_LEG: "unit-react19" }
  script:
    # REQ-PLAT-47: each leg runs on React 19 (tests/react19/runtime.ts asserts the major).
    - npm install --no-save --no-audit --no-fund --ignore-scripts react@19.3.0 react-dom@19.3.0 @types/react@19.3.0 @types/react-dom@19.3.0
    - test -f "tests/react19/$AG_REACT19_LEG.test.tsx"
    - npx jest --ci --testPathPattern "tests/react19/$AG_REACT19_LEG"

plat:test:visual-4x:
  extends: .plat-playwright
  stage: test
  allow_failure: true
  rules:
    # Same 4x scopes as plat:gate:change-class (incl. v4.* tag pipelines), so
    # the gate's visual-class input exists wherever the gate runs on 4x
    # (REQ-FIN-10: a 4x >= 4.2.0 run without the report fails change-class).
    - if: $AG_LINE == "4x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main" || $AG_SCOPE == "release")
  script:
    - npm run build-storybook
    - npx serve -s storybook-static -l 6006 &
    - npx wait-on http://localhost:6006
    # VisualClassReport at the path scripts/release/lib/policy.mjs reads on 4x
    # (.artifacts/plat/$CI_JOB_NAME_SLUG/ = .artifacts/plat/plat-test-visual-4x/).
    - npm run test:visual:app-chrome -- --class-report .artifacts/plat/plat-test-visual-4x/visual-class.json
    # consumer-4x fixture wired into the visual lane (REQ-PLAT-63). No fail-open:
    # a fixture failure fails the job; the job stays allow_failure: true only
    # until its ci/plat/activation.json row lands (REQ-FIN-22 procedure).
    - AG_CONSUMER_4X=1 node scripts/ci/run-vite-integration.js --skip-build
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths: [.artifacts/plat/plat-test-visual-4x/, .artifacts/plat/visual-4x/, .artifacts/plat/]

plat:test:canaries:
  extends: .plat-playwright
  stage: test
  allow_failure: true
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main")
  script:
    - |
      ok=1
      for c in canaries/vite-compiler canaries/types-strict canaries/jest-cjs; do
        if [ -d "$c" ]; then
          (cd "$c" && npx playwright test) || ok=0
        else
          echo "PENDING: $c (lane 1d)"; ok=0
        fi
      done
      [ "$ok" = 1 ] || exit 1
    - 'test -f scripts/ci/verify-compiler.mjs || { echo "PENDING: scripts/ci/verify-compiler.mjs (lane 1d)"; exit 1; }'
    - node scripts/ci/verify-compiler.mjs

# REQ-FIN-09 / REQ-FIN-40 / REQ-FIN-41 (B3-7): the workspace suites, the
# packed-d.ts type tests and the codemod canary consume the tarballs from
# plat:package:pack (.artifacts/pack/, $AURAGLASS_TARBALL via its dotenv), so
# the job runs in certify — GitLab `needs` may not point at a later stage.
# 4x (4.3 scope): @auraglass/cli is the only workspace on release/4.x; its
# fixtures type-check against the packed 4.3 d.ts (REQ-PLAT-91), which is the
# tarball plat:package:pack writes on this line. The registry/mcp/labs
# workspaces and tests/types/plat (5.0 types, REQ-PLAT-93) are 5x-only.
plat:test:cli:
  extends: .plat-playwright
  stage: certify
  allow_failure: true
  needs:
    - { job: "plat:package:pack", artifacts: true }
  rules:
    - if: $AG_SCOPE == "pr" || $AG_SCOPE == "main"
  script:
    - |
      if [ "$AG_LINE" = "4x" ]; then
        test -d packages/cli || { echo "PENDING: packages/cli (lane 1e, from 4.3)"; exit 1; }
        node -e "process.exit(require('./packages/cli/package.json').scripts?.test ? 0 : 1)" \
          || { echo "PENDING: npm test -w packages/cli has no test script (REQ-FIN-09)"; exit 1; }
        mkdir -p "$CI_PROJECT_DIR/.artifacts/plat/$CI_JOB_NAME_SLUG"
        npm test -w packages/cli -- --ci --json --outputFile="$CI_PROJECT_DIR/.artifacts/plat/$CI_JOB_NAME_SLUG/cli-jest.json"
      else
        for w in cli registry mcp labs; do
          node -e "process.exit(require('./packages/$w/package.json').scripts?.test ? 0 : 1)" \
            || { echo "PENDING: npm test -w packages/$w has no test script (REQ-FIN-09)"; exit 1; }
        done
        npm test -w packages/cli -w packages/registry -w packages/mcp -w packages/labs
        test -f tests/types/plat/tsconfig.json || { echo "PENDING: tests/types/plat/tsconfig.json over the packed d.ts (REQ-FIN-41)"; exit 1; }
        npx tsc -p tests/types/plat
        test -f tests/dx/codemod-canary.spec.ts || { echo "PENDING: tests/dx/codemod-canary.spec.ts (lane 1e)"; exit 1; }
        npx playwright test tests/dx/codemod-canary.spec.ts
      fi
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths: [".artifacts/plat/$CI_JOB_NAME_SLUG/"]

plat:test:registry:
  extends: .plat-playwright
  stage: test
  allow_failure: true
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main")
  script:
    - 'test -f scripts/registry/build.mjs || { echo "PENDING: scripts/registry/build.mjs (lane 1f)"; exit 1; }'
    - node scripts/registry/build.mjs
    - node scripts/registry/lint.mjs
    - |
      for s in tests/dx/registry-render.spec.ts tests/dx/registry-shadcn-interop.spec.ts; do
        test -f "$s" || { echo "PENDING: $s (lane 1f)"; exit 1; }
        npx playwright test "$s"
      done

plat:test:docs:
  extends: .plat-playwright
  stage: test
  allow_failure: true
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main")
  script:
    - 'test -f scripts/docs/compile-snippets.mjs || { echo "PENDING: scripts/docs/compile-snippets.mjs (lane 1f)"; exit 1; }'
    - node scripts/docs/compile-snippets.mjs
    - |
      for s in tests/dx/quickstart.spec.ts tests/dx/plain-css.spec.ts tests/dx/docs-a11y.spec.ts tests/dx/docs-lighthouse.spec.ts; do
        test -f "$s" || { echo "PENDING: $s (lane 1f)"; exit 1; }
        npx playwright test "$s"
      done

plat:gate:removal:
  extends: .plat-node
  stage: test
  allow_failure: true
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main")
  script:
    - 'test -f scripts/removal/gen-component-dispositions.mjs || { echo "PENDING: scripts/removal/gen-component-dispositions.mjs (lane 1c)"; exit 1; }'
    - node scripts/removal/gen-component-dispositions.mjs --check
    - node scripts/removal/consumer-grep.mjs --verify
    - |
      if [ -f scripts/removal/revert-dry-run.mjs ]; then
        node scripts/removal/revert-dry-run.mjs
      else
        echo "PENDING: removal revert dry-run (lane 1c)"
        exit 1
      fi

plat:gate:change-class:
  extends: .plat-node
  stage: test
  allow_failure: true # PLAT-015
  variables: { GIT_DEPTH: "0" }
  # REQ-FIN-10 / REQ-PLAT-05 item 8 (4x): ordered after plat:test:visual-4x and
  # downloads its artifacts, so classify-change.mjs reads
  # .artifacts/plat/plat-test-visual-4x/visual-class.json. optional: true only
  # because the 5x line has no visual-4x job; on 4x both jobs share the same
  # scopes, so the need always resolves, and a missing report fails the gate.
  needs:
    - { job: "plat:test:visual-4x", artifacts: true, optional: true }
  rules:
    - if: $CI_COMMIT_TAG
      allow_failure: false
    - if: $AG_SCOPE == "pr" || $AG_SCOPE == "main" || $AG_SCOPE == "release"
  script:
    - BASE=$([ "$AG_LINE" = "4x" ] && echo release/4.x || echo next)
    - git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE" "+refs/tags/*:refs/tags/*"
    - 'test -f scripts/release/classify-change.mjs || { echo "PENDING: scripts/release/classify-change.mjs (lane 1c)"; exit 1; }'
    - |
      if [ "$AG_SCOPE" = "release" ]; then
        PREV=$(git tag --list --sort=-v:refname | grep -v "^$CI_COMMIT_TAG\$" | head -1)
        node scripts/release/classify-change.mjs --base "$PREV" --line "$AG_LINE"
      else
        node scripts/release/classify-change.mjs --base "origin/$BASE" --line "$AG_LINE"
      fi

plat:integration:next:
  extends: .plat-playwright
  stage: test
  allow_failure: true # PLAT-015
  rules:
    - if: $CI_COMMIT_TAG
      allow_failure: false
    - if: $AG_SCOPE == "pr" || $AG_SCOPE == "main" || $AG_SCOPE == "release"
  script:
    - |
      if [ "$AG_LINE" = "4x" ]; then
        npm run test:integration:next -- --skip-build
      else
        ok=1
        for c in canaries/next16 canaries/next15; do
          if [ -d "$c" ]; then
            (cd "$c" && npx playwright test) || ok=0
          else
            echo "PENDING: $c (lane 1d)"; ok=0
          fi
        done
        [ "$ok" = 1 ] || exit 1
      fi

plat:integration:vite:
  extends: .plat-playwright
  stage: test
  allow_failure: true # PLAT-015
  rules:
    - if: $CI_COMMIT_TAG
      allow_failure: false
    - if: $AG_SCOPE == "pr" || $AG_SCOPE == "main" || $AG_SCOPE == "release"
  script:
    - |
      if [ "$AG_LINE" = "4x" ]; then
        npm run test:integration:vite -- --skip-build
      else
        ok=1
        for c in canaries/vite canaries/vite-tailwind4; do
          if [ -d "$c" ]; then
            (cd "$c" && npx playwright test) || ok=0
          else
            echo "PENDING: $c (lane 1d)"; ok=0
          fi
        done
        [ "$ok" = 1 ] || exit 1
      fi

# ---------------------------------------------------------------- package

plat:package:pack:
  extends: .plat-release
  stage: package
  allow_failure: true
  needs:
    - { job: "plat:build:dist", artifacts: true }   # verify:pack packs the built dist/ + workers/
    - { job: "plat:gate:glass-quality" }
    - { job: "plat:gate:change-class" }
    - { job: "plat:integration:next" }
    - { job: "plat:integration:vite" }
  rules:
    - if: $AG_SCOPE == "pr" || $AG_SCOPE == "main" || $AG_SCOPE == "release"
  script:
    # REQ-PLAT-05/39: first script line, unconditional — the script itself
    # enforces on tag/release scope and exits 0 elsewhere.
    - node scripts/ci/require-activated.mjs --line "$AG_LINE"
    - |
      if [ "$AG_SCOPE" = "release" ]; then
        test -f scripts/release/dry-run.mjs || { echo "PENDING: scripts/release/dry-run.mjs"; exit 1; }
        node scripts/release/dry-run.mjs --tag "$CI_COMMIT_TAG" --line "$AG_LINE"
      fi
    - |
      if [ "$AG_LINE" = "4x" ]; then
        node -e "process.exit(Object.keys(require('./package.json').scripts||{}).includes('verify:pack')?0:1)" \
          && npm run verify:pack \
          || { echo "verify:pack missing on 4x"; exit 1; }
      else
        node -e "process.exit(Object.keys(require('./package.json').scripts||{}).includes('pack:verify')?0:1)" \
          || { echo "PENDING: npm script pack:verify (lane 1d)"; exit 1; }
        npm run pack:verify
      fi
    # REQ-PLAT-11 (B3-9): every npm pack call keeps its --json report in the
    # job dir (.artifacts/plat/$CI_JOB_NAME_SLUG/, contract EVIDENCE.jobDir);
    # pack-record.json is built from those reports below.
    - mkdir -p .artifacts/pack .artifacts/plat ".artifacts/plat/$CI_JOB_NAME_SLUG/npm-pack"
    - npm pack --json --pack-destination .artifacts/pack > ".artifacts/plat/$CI_JOB_NAME_SLUG/npm-pack/aura-glass.json"
    - |
      if [ "$AG_LINE" = "5x" ]; then
        for w in cli registry mcp labs; do
          if [ -d "packages/$w" ]; then
            npm pack --json -w "packages/$w" --pack-destination .artifacts/pack > ".artifacts/plat/$CI_JOB_NAME_SLUG/npm-pack/$w.json"
          fi
        done
      fi
    # REQ-PLAT-11: { name: { file, integrity } } for every tarball in
    # .artifacts/pack, from npm's sha512 (re-hashed; fails closed on mismatch or
    # an unrecorded .tgz). plat:publish:npm receives it with this job's artifacts.
    - node ci/plat/pack-record.mjs --pack-dir .artifacts/pack --out ".artifacts/plat/$CI_JOB_NAME_SLUG/pack-record.json" ".artifacts/plat/$CI_JOB_NAME_SLUG"/npm-pack/*.json
    - echo "AURAGLASS_TARBALL=$(ls .artifacts/pack/*.tgz 2>/dev/null | head -1)" > .artifacts/plat/pack.env
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 90 days
    paths: [.artifacts/pack/, .artifacts/plat/]
    reports: { dotenv: .artifacts/plat/pack.env }

# ---------------------------------------------------------------- build (docs)

# B3-8 (REQ-FIN-43 / REQ-FIN-26 wiring; REQ-PLAT-99, REQ-PLAT-07): the docs
# site is built from the aura-glass tarball that plat:package:pack writes to
# .artifacts/pack/, so the job runs in the package stage with `needs` on pack
# (GitLab `needs` may not point at a later stage, and pages in deploy still
# follows it). The tarball is the one for the root package.json version, never
# "whatever .artifacts/pack holds"; the docs build receives it as
# AURAGLASS_TARBALL. pack runs on every scope this job runs on, so the need
# always resolves.
plat:build:docs:
  extends: .plat-node
  stage: package
  allow_failure: true
  needs:
    - { job: "plat:package:pack", artifacts: true }
  rules:
    - if: $AG_SCOPE == "pr" || $AG_SCOPE == "main"
  script:
    - TGZ=".artifacts/pack/aura-glass-$(node -p "require('./package.json').version").tgz"
    - 'test -f "$TGZ" || { echo "plat:build:docs: $TGZ missing from the plat:package:pack artifacts (REQ-PLAT-99)"; exit 1; }'
    - export AURAGLASS_TARBALL="$TGZ"
    - 'echo "plat:build:docs: docs consume $AURAGLASS_TARBALL"'
    - |
      if [ "$AG_LINE" = "4x" ]; then
        # 4.x docs site -> apps/docs/out/ (REQ-PLAT-07). Producer is FIN-C's 4x docs build (REQ-FIN-43).
        node -e "process.exit(Object.keys(require('./package.json').scripts||{}).includes('docs:build')?0:1)" \
          || { echo "PENDING: npm script docs:build (4.x docs site -> apps/docs/out, FIN-C REQ-FIN-43)"; exit 1; }
        npm run docs:build
        test -f apps/docs/out/index.html || { echo "plat:build:docs: apps/docs/out/index.html was not produced"; exit 1; }
      else
        node -e "process.exit(Object.keys(require('./package.json').scripts||{}).includes('docs:build')?0:1)" \
          || { echo "PENDING: npm script docs:build (lane 1f)"; exit 1; }
        npm run docs:build
      fi
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths: [apps/docs/out/, apps/docs/public/, storybook-static/, .artifacts/plat/]

# ---------------------------------------------------------------- deploy

pages:
  extends: .plat-node
  stage: deploy
  needs:
    - { job: "plat:build:docs", artifacts: true }
    - { job: "qual:build:storybook", artifacts: true, optional: true }
    - { job: "plat:test:registry", artifacts: true, optional: true }
  rules:
    - if: $CI_COMMIT_BRANCH == $AG_PAGES_BRANCH && $AG_SCOPE == "main"
  script:
    - node scripts/ci/assemble-pages.mjs
  environment: { name: pages, deployment_tier: production, url: $CI_PAGES_URL }
  artifacts:
    name: "pages-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths: [public/]

# ---------------------------------------------------------------- publish

plat:release:notes:
  extends: .plat-release
  stage: publish
  allow_failure: true
  needs:
    - { job: "plat:package:pack", artifacts: true }
  rules:
    - if: $AG_SCOPE == "release"
  script:
    - 'test -f scripts/release/release-notes.mjs || { echo "PENDING: scripts/release/release-notes.mjs (lane 1c)"; exit 1; }'
    - node scripts/release/release-notes.mjs --tag "$CI_COMMIT_TAG" --line "$AG_LINE" --out .artifacts/plat/release-notes.md
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 90 days
    paths: [.artifacts/plat/]
  release:
    tag_name: $CI_COMMIT_TAG
    name: "AuraGlass $CI_COMMIT_TAG"
    description: "Release notes for this tag are generated by the pipeline into .artifacts/plat/release-notes.md (linked asset)."
    assets:
      links:
        - { name: "release-notes.md", url: "$CI_JOB_URL/artifacts/file/.artifacts/plat/release-notes.md", link_type: other }
        - { name: "dist-maps.tgz", url: "$CI_JOB_URL/artifacts/file/.artifacts/plat/dist-maps.tgz", link_type: package }
        - { name: "job evidence", url: "$CI_JOB_URL/artifacts/browse/.artifacts/plat/", link_type: other }

plat:publish:npm:
  extends: [.ag-node, .ag-evidence-release]
  stage: publish
  tags: [saas-linux-small-amd64]
  environment: { name: npm-publish, deployment_tier: production }
  rules:
    - if: $AG_SCOPE == "release"
  needs:
    - { job: "plat:package:pack", artifacts: true }
    - { job: "qual:certify:release", artifacts: true, optional: true }
    - { job: "plat:release:verify-codemods", artifacts: true, optional: true }
    - { job: "plat:release:deprecation-coverage", artifacts: true, optional: true }
    - { job: "plat:release:verify-cli", artifacts: true, optional: true }
  id_tokens:
    NPM_ID_TOKEN:      { aud: "npm:registry.npmjs.org" }
    SIGSTORE_ID_TOKEN: { aud: "sigstore" }
  script:
    - npm install -g "npm@$AG_NPM_VERSION"
    - node scripts/release/verify-release-verdict.mjs --tag "$CI_COMMIT_TAG" --line "$AG_LINE"
    - node scripts/release/publish.mjs --tag "$CI_COMMIT_TAG" --line "$AG_LINE" --v4-dist-tag "$AG_V4_DIST_TAG"
    # @auraglass/cli@0.x ships from v4.3.* tags (REQ-PLAT-62). It publishes here
    # because contract rule 8 / §4.13.7 lets only plat:publish:npm hold the npm
    # OIDC id_tokens and the npm-publish environment. The manual
    # plat:release:verify-cli job (no credentials) runs `npm test -w packages/cli`
    # and `migrate 4to5 --dry-run` on the consumer fixture first; publishing
    # fails closed without its evidence from this pipeline.
    - |
      case "$CI_COMMIT_TAG" in
        v4.3.*)
          test -s .artifacts/plat/plat-release-verify-cli/migrate-4to5-dry-run.json \
            || { echo "FAIL: no plat:release:verify-cli evidence in this pipeline; @auraglass/cli is not published"; exit 1; }
          npm publish -w packages/cli --access public --provenance
          ;;
      esac

plat:release:verify-dist-tags:
  extends: .plat-release
  stage: publish
  rules:
    - if: $AG_SCOPE == "release"
      when: manual
      allow_failure: false
    - if: $AG_SCOPE == "main" || $AG_SCOPE == "pr"
      when: manual
      allow_failure: true
  script:
    - mkdir -p ".artifacts/plat/$CI_JOB_NAME_SLUG"
    - node scripts/release/dist-tag.mjs --check "${CI_COMMIT_TAG:-manual-run}" --line "$AG_LINE" --v4-dist-tag "$AG_V4_DIST_TAG" --out ".artifacts/plat/$CI_JOB_NAME_SLUG/dist-tags.json"

plat:release:verify-codemods:
  extends: .plat-release
  stage: publish
  rules:
    # REQ-PLAT-62: the v4.3.0 tag requires non-empty mat/cmp/surf codemod
    # fragments (they arrive via the next -> release/4.x codemods sync,
    # REQ-FIN-13). Earlier 4.x tags do not carry this requirement.
    - if: $AG_SCOPE == "release" && $CI_COMMIT_TAG =~ /^v4\.3\./
  script:
    - mkdir -p ".artifacts/plat/$CI_JOB_NAME_SLUG"
    - |
      out=".artifacts/plat/$CI_JOB_NAME_SLUG/codemod-fragments.json"
      fail=0; rows=""
      for f in mat cmp surf qual; do
        p="fragments/codemods/$f.ts"
        if [ -f "$p" ] && grep -q "CodemodMappingFragment" "$p" && ! grep -qz "export default {} satisfies CodemodMappingFragment" "$p"; then st=non-empty; else st=empty; fi
        rows="$rows{\"stream\":\"$f\",\"path\":\"$p\",\"status\":\"$st\"},"
        if [ "$f" != "qual" ] && [ "$st" = "empty" ]; then
          echo "FAIL: $p is empty; v4.3.0 requires non-empty mat/cmp/surf (next -> release/4.x codemods sync, REQ-FIN-13)"; fail=1
        fi
      done
      printf '{"tag":"%s","sha":"%s","fragments":[%s]}\n' "$CI_COMMIT_TAG" "$CI_COMMIT_SHA" "${rows%,}" > "$out"
      cat "$out"
      exit "$fail"
    - 'echo "codemod fragments: mat/cmp/surf non-empty (qual.ts stays {}; see docs/release/codemods-qual.md)"'
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 90 days
    paths: [".artifacts/plat/$CI_JOB_NAME_SLUG/"]

plat:release:deprecation-coverage:
  extends: .plat-release
  stage: publish
  rules:
    - if: $AG_SCOPE == "release"
  script:
    # Coverage is written on every 4.x tag; the --ga gate (every entry covered by
    # a published 4.x minor >= 4.2.0) applies from the v4.3.* tags (REQ-PLAT-62).
    - |
      case "$CI_COMMIT_TAG" in
        v4.3.*) node scripts/release/verify-breaking-register.mjs --coverage-only --ga ;;
        *)      node scripts/release/verify-breaking-register.mjs --coverage-only ;;
      esac
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 90 days
    paths: [.artifacts/plat/deprecation-coverage.json]

plat:release:verify-cli:
  extends: .plat-release
  stage: publish
  rules:
    # Manual, blocking gate for the @auraglass/cli@0.x publish on v4.3.* tags.
    # No credentials: plat:publish:npm does the publish (rule 8).
    - if: $AG_SCOPE == "release" && $CI_COMMIT_TAG =~ /^v4\.3\./
      when: manual
      allow_failure: false
  script:
    - mkdir -p ".artifacts/plat/$CI_JOB_NAME_SLUG"
    - npm test -w packages/cli
    - npm run build -w packages/cli
    # Dry run on the 4.x consumer fixture. TODOs are expected manual-migration
    # notes and are recorded in the report; the run must parse and change files.
    - node packages/cli/dist/bin.js migrate 4to5 --dry-run --json --allow-todo --cwd tests/fixtures/consumer-4x > ".artifacts/plat/$CI_JOB_NAME_SLUG/migrate-4to5-dry-run.json"
    - >-
      node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));
      if(r.dryRun!==true||!r.summary||!(r.summary.filesChanged>0)){console.error("FAIL: migrate 4to5 --dry-run changed no files on tests/fixtures/consumer-4x");process.exit(1)}
      console.log("migrate 4to5 --dry-run:",JSON.stringify(r.summary))' ".artifacts/plat/$CI_JOB_NAME_SLUG/migrate-4to5-dry-run.json"
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 90 days
    paths: [".artifacts/plat/$CI_JOB_NAME_SLUG/"]

# ---------------------------------------------------------------- certify

# REQ-PLAT-89 / REQ-FIN-40 (B3-7): manual reference run of `audit backdrop`
# against packages/cli/audit/reference-server.mjs, started by the audit
# Playwright config. `when: manual` sits on the rule: with `rules:` present a
# job-level `when` from a template is not applied. 5x only (same job on next).
plat:audit:backdrop:
  extends: .plat-playwright
  image: $AG_PLAYWRIGHT_IMAGE
  stage: certify
  allow_failure: true
  rules:
    - if: $AG_LINE == "5x" && $AG_SCOPE != "release"
      when: manual
  script:
    - 'test -f packages/cli/audit/playwright.config.ts || { echo "PENDING: packages/cli/audit/playwright.config.ts (REQ-PLAT-89)"; exit 1; }'
    - 'test -f tests/dx/audit-backdrop.remote.spec.ts || { echo "PENDING: tests/dx/audit-backdrop.remote.spec.ts (REQ-PLAT-89)"; exit 1; }'
    - npx playwright test -c packages/cli/audit/playwright.config.ts
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 30 days
    paths: [".artifacts/plat/$CI_JOB_NAME_SLUG/"]
