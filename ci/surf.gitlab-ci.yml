# ci/surf.gitlab-ci.yml — SURF stream CI fragment (contract-v1.1 §4.13.4; S-53).
# Lane blocks are owned by SURF lanes W1..W5; edit only your own block.
# Job names must be surf:<stage>:<name>, stage must be one of the root stages,
# rules only on $AG_SCOPE/$AG_LINE, evidence only under .artifacts/surf/ with
# expire_in, and every job is allow_failure: true until its first green run on
# next, when the owning lane flips it (AC-SURF-31).

# --- stream templates begin (lane W5 owns; SURF-628) ---
.surf-base:
  extends: .ag-node

.surf-playwright:
  extends: .ag-playwright
# --- stream templates end ---

# --- lane W1 begin ---

# --- lane W1 end ---

# --- lane W2 begin ---
# W2 rides the shared jobs: surf:test:doubles matrix cell DOUBLES_AREA=data
# (tests/data/jest.doubles.cjs) plus the root lint/test lanes registered in
# fragments/lanes/surf.ts. No W2-specific jobs.
# --- lane W2 end ---

# --- lane W3 begin ---

# SURF-636 (REQ-SURF-195): deterministic AI fixtures. gen-ai-fixtures writes
# golden transcripts under tests/ai/fixtures/ and verifies freshness with
# --check on every branch pipeline; lanes W3/W4 extend the corpus.
surf:build:ai-fixtures:
  extends: .surf-base
  stage: build
  allow_failure: true # owning lane flips to false after first green on next
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main" || $AG_SCOPE == "release")
  script:
    - node scripts/surf/gen-ai-fixtures.mjs --check
    - node scripts/build/gen-ai-thread-fixture.mjs --check
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: always
    paths:
      - .artifacts/surf/ai-fixtures/

# SURF-637 (REQ-SURF-195): AI SDK contract suite against the SDK pinned in the
# root package.json devDependencies (ai@5.0.29 / @ai-sdk/react@2.0.29, AI SDK
# v5; a move to v6 is OD-16). No scratch install: the root tsc covers
# tests/types/surf (REQ-SURF-106) and root jest runs the compat fixture test,
# the useAuraChat adapter test and the ai-workspace route tests
# (REQ-SURF-106/-172).
surf:test:ai-sdk:
  extends: .surf-base
  stage: test
  allow_failure: true # owning lane flips to false after first green on next
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main" || $AG_SCOPE == "release")
  script:
    - set -o pipefail
    - mkdir -p .artifacts/surf/ai-sdk
    - npx tsc -p tsconfig.json --noEmit 2>&1 | tee .artifacts/surf/ai-sdk/tsc.log
    - npm test -- --ci tests/types/surf registry/items/ai-sdk-adapter registry/blocks/ai-workspace tests/capability/registry/ai-workspace-route 2>&1 | tee .artifacts/surf/ai-sdk/jest.log
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: always
    paths:
      - .artifacts/surf/ai-sdk/

# --- lane W3 end ---

# --- lane W4 begin ---

# --- lane W4 end ---

# --- lane W5 begin ---

# SURF-561 (REQ-SURF-187): capability-ledger gate. Runs the ledger verifier and,
# on every branch pipeline, re-checks rows added since the merge-base with
# origin/next. No root package.json script is added.
surf:test:ledger:
  extends: .surf-base
  stage: test
  allow_failure: true # owning lane flips to false after first green on next
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main" || $AG_SCOPE == "release")
  script:
    - set -o pipefail
    - mkdir -p .artifacts/surf/ledger
    - git fetch --no-tags origin "+refs/heads/next:refs/remotes/origin/next"
    - node scripts/surf/verify-capability-ledger.mjs 2>&1 | tee .artifacts/surf/ledger/verify.log
    - node scripts/surf/verify-capability-ledger.mjs --diff "$(git merge-base HEAD origin/next)" 2>&1 | tee .artifacts/surf/ledger/diff.log
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: always
    paths:
      - .artifacts/surf/ledger/

# SURF doubles: one cell per area. ci/surf/doubles/run.mjs runs the area's
# tests/<area>/jest.doubles.cjs preset (CMP specifiers mapped onto
# tests/contract-doubles/cmp/*) while it exists, and the root jest config on the
# same test paths once the preset is retired (REQ-FIN-08/09). A cell never
# passes without running tests; output goes to .artifacts/surf/doubles/<area>.*.
surf:test:doubles:
  extends: .surf-base
  stage: test
  allow_failure: true # owning lane flips to false after first green on next
  parallel:
    matrix:
      - DOUBLES_AREA: [app-shell, data, ai, media, capability]
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main")
  script:
    - node ci/surf/doubles/run.mjs "$DOUBLES_AREA"
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: always
    paths:
      - .artifacts/surf/doubles/

# --- lane W5 end ---
