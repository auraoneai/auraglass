  variables:
    AG_REQUIRE_DIST: "1"
  script:
    - mkdir -p .artifacts/surf/peer-isolation
    - npx jest --ci tests/data/exports/peer-isolation.test.ts tests/data/exports/table-row-models.test.ts tests/data/exports/data-peer-isolation.test.ts --json --outputFile=.artifacts/surf/peer-isolation/jest.json
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: always
    paths:
      - .artifacts/surf/peer-isolation/

# --- lane W5 end ---
