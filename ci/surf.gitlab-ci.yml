# REQ-SURF-152: tone calibration over the 8 QUAL S-42 scenes in Chromium with
# the real sampler. Writes .artifacts/surf/media-tone/media-tone-calibration.json
# (measured per-scene stats, anchor verdicts, derived TONE_* intervals), then
