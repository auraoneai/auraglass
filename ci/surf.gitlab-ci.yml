# ci/surf.gitlab-ci.yml — SURF stream CI fragment (contract-v1.1 §4.13.4; S-53).
# Lane blocks are owned by SURF lanes W1..W5; edit only your own block.
# Job names must be surf:<stage>:<name>, stage must be one of the root stages,
# rules only on $AG_SCOPE/$AG_LINE, evidence only under .artifacts/surf/ with
# expire_in, and every job is allow_failure: true until its first green run on
# next, when the owning lane flips it (AC-SURF-31).

# --- stream templates begin (lane W5 owns; SURF-628) ---
.surf-base:
  extends: .ag-node

.surf-playwright:
  extends: .ag-playwright
# --- stream templates end ---

# --- lane W1 begin ---

# --- lane W1 end ---

# --- lane W2 begin ---
# W2 rides the shared jobs: surf:test:doubles matrix cell DOUBLES_AREA=data
# (tests/data/jest.doubles.cjs) plus the root lint/test lanes registered in
# fragments/lanes/surf.ts.
# REQ-SURF-81/84 (REQ-FIN-83): SURF type tests — every @ts-expect-error in
# tests/types/surf/*.test-d.ts(x) must be consumed (tsc reports an unused
# directive as TS2578), positive rows must compile.
surf:test:types:
  extends: .surf-base
  stage: test
  allow_failure: true # owning lane flips to false after first green on next
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main" || $AG_SCOPE == "release")
  script:
    - mkdir -p .artifacts/surf/types
    - 'npx tsc -p tests/types/surf/tsconfig.json --noEmit --pretty false > .artifacts/surf/types/tsc.log 2>&1 || { cat .artifacts/surf/types/tsc.log; exit 1; }'
    - 'echo "surf type tests - 0 errors" | tee -a .artifacts/surf/types/tsc.log'
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: always
    paths:
      - .artifacts/surf/types/
# --- lane W2 end ---

# --- lane W3 begin ---

# SURF-636 (REQ-SURF-195): deterministic AI fixtures. gen-ai-fixtures writes
# golden transcripts under tests/ai/fixtures/ and verifies freshness with
# --check on every branch pipeline; lanes W3/W4 extend the corpus.
surf:build:ai-fixtures:
  extends: .surf-base
  stage: build
  allow_failure: true # owning lane flips to false after first green on next
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main" || $AG_SCOPE == "release")
  script:
    - node scripts/surf/gen-ai-fixtures.mjs --check
    - node scripts/build/gen-ai-thread-fixture.mjs --check
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: always
    paths:
      - .artifacts/surf/ai-fixtures/

# SURF-637 (REQ-SURF-195): AI SDK contract suite — provider-agnostic envelope
# tests against the AI SDK v6 devDeps. Reports pending (not red) until the
# suite exists (lane W3).
surf:test:ai-sdk:
  extends: .surf-base
  stage: test
  allow_failure: true # owning lane flips to false after first green on next
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main" || $AG_SCOPE == "release")
  script:
    # AC-SURF-02: the pins install into .artifacts/, never the repo package.json.
    - mkdir -p .artifacts/surf/ai-sdk
    - cp ci/surf/ai-sdk/package.json .artifacts/surf/ai-sdk/package.json
    - npm install --prefix .artifacts/surf/ai-sdk --no-save
    - ln -sfn ../../../.artifacts/surf/ai-sdk/node_modules ci/surf/ai-sdk/node_modules
    - npx tsc -p ci/surf/ai-sdk/tsconfig.json
    - npx jest ci/surf/ai-sdk --ci
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: always
    paths:
      - .artifacts/surf/ai-sdk/

# --- lane W3 end ---

# --- lane W4 begin ---

# --- lane W4 end ---

# --- lane W5 begin ---

# SURF-561 (REQ-SURF-187): capability-ledger gate. Runs the ledger verifier and,
# on every branch pipeline, re-checks rows added since the merge-base with
# origin/next. No root package.json script is added.
surf:test:ledger:
  extends: .surf-base
  stage: test
  allow_failure: true # owning lane flips to false after first green on next
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main" || $AG_SCOPE == "release")
  script:
    - git fetch --no-tags origin "+refs/heads/next:refs/remotes/origin/next"
    - node scripts/surf/verify-capability-ledger.mjs
    - node scripts/surf/verify-capability-ledger.mjs --diff "$(git merge-base HEAD origin/next)"
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: always
    paths:
      - .artifacts/surf/ledger/

# SURF doubles: each lane maps CMP module specifiers onto tests/contract-doubles/cmp/*
# through tests/<area>/jest.doubles.cjs. A missing preset reports pending and does
# not fail the matrix cell (per lane prompts).
surf:test:doubles:
  extends: .surf-base
  stage: test
  allow_failure: true # owning lane flips to false after first green on next
  parallel:
    matrix:
      - DOUBLES_AREA: [app-shell, data, ai, media, capability]
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main")
  script:
    - |
      if [ -f "tests/${DOUBLES_AREA}/jest.doubles.cjs" ]; then
        npx jest -c "tests/${DOUBLES_AREA}/jest.doubles.cjs" --ci
      else
        echo "pending: tests/${DOUBLES_AREA}/jest.doubles.cjs not present"
      fi
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: always
    paths:
      - .artifacts/surf/doubles/

# --- lane W5 end ---
