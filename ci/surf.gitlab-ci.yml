    - node scripts/surf/calibrate-media-tone.mjs --check --from .artifacts/surf/media-tone/media-tone-calibration.json
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
