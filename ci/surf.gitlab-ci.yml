# SURF-561 (REQ-SURF-187): capability-ledger gate. Runs the ledger verifier and,
# on every branch pipeline, re-checks rows added since the merge-base with
# origin/next. No root package.json script is added.
surf:test:ledger:
  extends: .surf-base
  stage: test
  allow_failure: false # first green on next: pipeline 2934559777 (ci/plat/activation.json)
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main" || $AG_SCOPE == "release")
  script:
    - set -o pipefail
    - mkdir -p .artifacts/surf/ledger
    - git fetch --no-tags origin "+refs/heads/next:refs/remotes/origin/next"
    - node scripts/surf/verify-capability-ledger.mjs 2>&1 | tee .artifacts/surf/ledger/verify.log
    - node scripts/surf/verify-capability-ledger.mjs --diff "$(git merge-base HEAD origin/next)" 2>&1 | tee .artifacts/surf/ledger/diff.log
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: always
    paths:
      - .artifacts/surf/ledger/

# REQ-SURF-170 (REQ-FIN-88): SURF registry lint over every S-46 SURF block and
# item directory, plus its mutation cases. The per-id files[] count and the
# violation report are kept as evidence.
surf:test:registry-lint:
  extends: .surf-base
  stage: test
  allow_failure: true # owning lane flips to false after first green on next
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main")
  script:
    - mkdir -p .artifacts/surf/registry-lint
    - node scripts/surf/verify-registry.mjs --count --json .artifacts/surf/registry-lint/report.json
    - npx jest tests/capability/registry/blocks-lint.test.ts --ci
    # REQ-SURF-177: registry-only names never reach the published package —
    # scanned in the extracted `npm pack` tarball's dist/. Extracted outside the
    # repo: a package.json named aura-glass inside it would collide with the
    # root package in jest-haste-map.
    - npm run build
    - AG_PACK_DIR="$(mktemp -d)"
    - npm pack --ignore-scripts --pack-destination "$AG_PACK_DIR"
    - tar -xzf "$AG_PACK_DIR"/*.tgz -C "$AG_PACK_DIR"
    - AG_TARBALL_DIR="$AG_PACK_DIR/package" npx jest tests/capability/registry-only.test.ts --ci
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: always
    paths:
      - .artifacts/surf/registry-lint/

# SURF doubles: one cell per area. ci/surf/doubles/run.mjs runs the area's
# tests/<area>/jest.doubles.cjs preset (CMP specifiers mapped onto
# tests/contract-doubles/cmp/*) while it exists, and the root jest config on the
# same test paths once the preset is retired (REQ-FIN-08/09). A cell never
# passes without running tests; output goes to .artifacts/surf/doubles/<area>.*.
surf:test:doubles:
  extends: .surf-base
  stage: test
  allow_failure: true # owning lane flips to false after first green on next
  parallel:
    matrix:
      - DOUBLES_AREA: [app-shell, data, ai, media, capability]
  # Jest runs over sources only. Earlier-stage artifacts (cmp:build:dts's
  # .artifacts/cmp/dts/pkg/package/package.json, name "aura-glass") would
  # collide with the root package in jest-haste-map and break every
  # jest.mock('aura-glass', …) — fetch none.
  dependencies: []
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main")
  # registry-only.test.ts needs the packed tarball: it runs in
  # surf:test:registry-lint (AG_TARBALL_DIR), not against doubles.
  script:
    - node ci/surf/doubles/run.mjs "$DOUBLES_AREA"
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: always
    paths:
      - .artifacts/surf/doubles/

# REQ-SURF-06 (AC-SURF-03): dist side-effect trap over the SURF entries.
# Consumes plat:build:dist's dist/ and runs PLAT's trap through the SURF
# wrapper; fails on any undeclared SURF call, a non-empty
# fragments/side-effects/surf.ts, or a SURF entry missing from dist.
surf:test:side-effects:
  extends: .surf-base
  stage: test
  allow_failure: true # owning lane flips to false after first green on next
  # optional: true is the contract rule for foreign needs; without the dist
  # artifact the wrapper fails closed ("dist/ missing").
  needs:
    - { job: "plat:build:dist", artifacts: true, optional: true }
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main" || $AG_SCOPE == "release")
  script:
    - node scripts/surf/verify-side-effects.mjs
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: always
    paths:
      - .artifacts/surf/side-effects/

# REQ-SURF-04: peer-isolation gate on the BUILT dist (esbuild metafile of the
# root Button and data Table consumer bundles: no react-aria-components,
# @internationalized/date, d3-*, no SURF trees in the root bundle) plus the
# per-feature row-model tree-shake check (REQ-SURF-66). AG_REQUIRE_DIST=1
