# ci/surf.gitlab-ci.yml — SURF stream CI fragment (contract-v1.1 §4.13.4; S-53).
# Lane blocks are owned by SURF lanes W1..W5; edit only your own block.
# Job names must be surf:<stage>:<name>, stage must be one of the root stages,
# rules only on $AG_SCOPE/$AG_LINE, evidence only under .artifacts/surf/ with
# expire_in, and every job is allow_failure: true until its first green run on
# next, when the owning lane flips it (AC-SURF-31).

# --- stream templates begin (lane W5 owns; SURF-628) ---
.surf-base:
  extends: .ag-node

.surf-playwright:
  extends: .ag-playwright
# --- stream templates end ---

# --- lane W1 begin ---

# --- lane W1 end ---

# --- lane W2 begin ---
# W2 rides the shared jobs: surf:test:doubles matrix cell DOUBLES_AREA=data
# (tests/data/jest.doubles.cjs) plus the root lint/test lanes registered in
# fragments/lanes/surf.ts, plus surf:test:canary-hydration below.
#
# REQ-SURF-08 (L11): browser hydration of the built Next 16 canary across time
# zones. The canary consumes the packed tarball from plat:build:dist's dist/,
# `next start` runs at TZ=Pacific/Kiritimati (UTC+14) and the spec's browser
# context at Pacific/Pago_Pago (UTC−11). Fails (never skips) when dist/ is
# missing.
surf:test:canary-hydration:
  extends: .surf-playwright
  stage: test
  allow_failure: true # owning lane flips to false after first green on next
  needs:
    - job: plat:build:dist
      artifacts: true
      optional: true # foreign job (contract §4.13.4); the script fails when dist/ is absent
  rules:
    - if: $AG_LINE == "5x" && $AG_SCOPE == "main"
  variables:
    AG_CANARY_PORT: "3116"
    AURAGLASS_EVIDENCE_DIR: .artifacts/surf/canary-hydration
  script:
    - mkdir -p .artifacts/surf/canary-hydration
    - 'test -f dist/index.js || { echo "dist/index.js missing: plat:build:dist must pass first"; exit 1; }'
    - npm pack --ignore-scripts --pack-destination .artifacts/surf/canary-hydration
    - mv .artifacts/surf/canary-hydration/aura-glass-*.tgz aura-glass.tgz
    - (cd canaries/next16 && npm install --no-audit --no-fund && npx next build)
    - (cd canaries/next16 && TZ=Pacific/Kiritimati nohup npx next start -p "$AG_CANARY_PORT" > ../../.artifacts/surf/canary-hydration/next-start.log 2>&1 &)
    - |
      for i in $(seq 1 60); do
        node -e 'fetch(process.argv[1]).then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))' "http://127.0.0.1:$AG_CANARY_PORT/surf/app-shell" && break
        [ "$i" = 60 ] && { echo "canary did not start"; cat .artifacts/surf/canary-hydration/next-start.log; exit 1; }
        sleep 2
      done
    - AG_CANARY_BASE_URL="http://127.0.0.1:$AG_CANARY_PORT" npx playwright test tests/ssr/surf/hydration.spec.ts --project=chromium
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: always
    paths:
      - .artifacts/surf/canary-hydration/

# REQ-SURF-81/84 (REQ-FIN-83): SURF type tests — every @ts-expect-error in
# tests/types/surf/*.test-d.ts(x) must be consumed (tsc reports an unused
# directive as TS2578), positive rows must compile.
surf:test:types:
  extends: .surf-base
  stage: test
  allow_failure: true # owning lane flips to false after first green on next
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main" || $AG_SCOPE == "release")
  script:
    - mkdir -p .artifacts/surf/types
    - 'npx tsc -p tests/types/surf/tsconfig.json --noEmit --pretty false > .artifacts/surf/types/tsc.log 2>&1 || { cat .artifacts/surf/types/tsc.log; exit 1; }'
    - 'echo "surf type tests - 0 errors" | tee -a .artifacts/surf/types/tsc.log'
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: always
    paths:
      - .artifacts/surf/types/

# REQ-SURF-77 (REQ-FIN-83): L1 lint over src/data — eslint (incl.
# react-hooks/rules-of-hooks at error and the auraglass/* rules) with 0
# warnings, plus the rules-of-hooks Linter test. Blocking: no allow_failure.
surf:test:lint-data:
  extends: .surf-base
  stage: test
  allow_failure: false
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main" || $AG_SCOPE == "release")
  script:
    - mkdir -p .artifacts/surf/lint-data
    - 'npx eslint src/data --max-warnings 0 --format stylish -o .artifacts/surf/lint-data/eslint.txt || { cat .artifacts/surf/lint-data/eslint.txt; exit 1; }'
    - 'echo "eslint src/data - 0 problems" | tee -a .artifacts/surf/lint-data/eslint.txt'
    - npx jest --ci tests/lint/surf/rules-of-hooks.test.ts
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: always
    paths:
      - .artifacts/surf/lint-data/
# --- lane W2 end ---

# --- lane W3 begin ---

# SURF-636 (REQ-SURF-195): deterministic AI fixtures. gen-ai-fixtures writes
# golden transcripts under tests/ai/fixtures/ and verifies freshness with
# --check on every branch pipeline; lanes W3/W4 extend the corpus.
surf:build:ai-fixtures:
  extends: .surf-base
  stage: build
  allow_failure: true # owning lane flips to false after first green on next
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main" || $AG_SCOPE == "release")
  script:
    - node scripts/surf/gen-ai-fixtures.mjs --check
    - node scripts/build/gen-ai-thread-fixture.mjs --check
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: always
    paths:
      - .artifacts/surf/ai-fixtures/

# SURF-637 (REQ-SURF-195): AI SDK contract suite — provider-agnostic envelope
# tests against the AI SDK v6 devDeps. Reports pending (not red) until the
# suite exists (lane W3).
surf:test:ai-sdk:
  extends: .surf-base
  stage: test
  allow_failure: true # owning lane flips to false after first green on next
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main" || $AG_SCOPE == "release")
  script:
    # AC-SURF-02: the pins install into .artifacts/, never the repo package.json.
    - mkdir -p .artifacts/surf/ai-sdk
    - cp ci/surf/ai-sdk/package.json .artifacts/surf/ai-sdk/package.json
    # --legacy-peer-deps: react/zod peers resolve from the repo node_modules
    # (an ancestor of .artifacts/), so the harness shares the one React copy.
    - npm install --prefix .artifacts/surf/ai-sdk --no-save --legacy-peer-deps
    - ln -sfn ../../../.artifacts/surf/ai-sdk/node_modules ci/surf/ai-sdk/node_modules
    - npx tsc -p ci/surf/ai-sdk/tsconfig.json
    - npx jest -c ci/surf/ai-sdk/jest.config.mjs --ci
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: always
    paths:
      - .artifacts/surf/ai-sdk/

# --- lane W3 end ---

# --- lane W4 begin ---

# --- lane W4 end ---

# --- lane W5 begin ---

# SURF-561 (REQ-SURF-187): capability-ledger gate. Runs the ledger verifier and,
# on every branch pipeline, re-checks rows added since the merge-base with
# origin/next. No root package.json script is added.
surf:test:ledger:
  extends: .surf-base
  stage: test
  allow_failure: true # owning lane flips to false after first green on next
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main" || $AG_SCOPE == "release")
  script:
    - git fetch --no-tags origin "+refs/heads/next:refs/remotes/origin/next"
    - node scripts/surf/verify-capability-ledger.mjs
    - node scripts/surf/verify-capability-ledger.mjs --diff "$(git merge-base HEAD origin/next)"
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: always
    paths:
      - .artifacts/surf/ledger/

# SURF doubles: each lane maps CMP module specifiers onto tests/contract-doubles/cmp/*
# through tests/<area>/jest.doubles.cjs. A missing preset reports pending and does
# not fail the matrix cell (per lane prompts).
surf:test:doubles:
  extends: .surf-base
  stage: test
  allow_failure: true # owning lane flips to false after first green on next
  parallel:
    matrix:
      - DOUBLES_AREA: [app-shell, data, ai, media, capability]
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main")
  script:
    - |
      if [ -f "tests/${DOUBLES_AREA}/jest.doubles.cjs" ]; then
        npx jest -c "tests/${DOUBLES_AREA}/jest.doubles.cjs" --ci
      else
        echo "pending: tests/${DOUBLES_AREA}/jest.doubles.cjs not present"
      fi
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: always
    paths:
      - .artifacts/surf/doubles/

# REQ-SURF-06 (AC-SURF-03): dist side-effect trap over the SURF entries.
# Consumes plat:build:dist's dist/ and runs PLAT's trap through the SURF
# wrapper; fails on any undeclared SURF call, a non-empty
# fragments/side-effects/surf.ts, or a SURF entry missing from dist.
surf:test:side-effects:
  extends: .surf-base
  stage: test
  allow_failure: true # owning lane flips to false after first green on next
  # optional: true is the contract rule for foreign needs; without the dist
  # artifact the wrapper fails closed ("dist/ missing").
  needs:
    - { job: "plat:build:dist", artifacts: true, optional: true }
  rules:
    - if: $AG_LINE == "5x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main" || $AG_SCOPE == "release")
  script:
    - node scripts/surf/verify-side-effects.mjs
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    when: always
    paths:
      - .artifacts/surf/side-effects/

# --- lane W5 end ---
