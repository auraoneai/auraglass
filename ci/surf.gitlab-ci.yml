    - (python3 -m http.server 6006 --bind 127.0.0.1 --directory storybook-static >/dev/null 2>&1 &)
    - node -e "const t=Date.now();(async function p(){try{if((await fetch('http://127.0.0.1:6006/iframe.html')).ok)return}catch{}if(Date.now()-t>60000){console.error('storybook-static not served on :6006');process.exit(1)}setTimeout(p,500)})()"
    - npx playwright test tests/a11y/apg/surf/tree-view.apg.spec.ts tests/e2e/surf/data/tree-virtual.spec.ts tests/perf/browser/surf/data-tree-view.spec.ts --project=chromium --project=webkit --project=firefox --reporter=line --output=.artifacts/surf/tree-view-browser/test-results
