# ci/mat.gitlab-ci.yml (MAT). Jobs are named mat:<stage>:<name>, extend .mat-base, rule only on
# $AG_SCOPE/$AG_LINE, keep allow_failure: true until each job's first green on next (the flip is a
# ci/plat/activation.json row), put evidence under .artifacts/mat/ with when: always + expire_in,
# and never use merge_request_event or credentials (§4.13.4). Certify jobs live only in ci/qual
# (rule 7): MAT registers lane cells in fragments/lanes/mat.ts instead. No `|| true` fail-opens.
.mat-base:
  extends: .ag-node

# Browser lanes run on the remote Playwright image only (rule 9).
.mat-browser:
  extends: .ag-playwright

mat:build:tokens:
  extends: .mat-base
  stage: build
  allow_failure: true
  rules:
    - if: $AG_LINE == "5x" && $AG_SCOPE != "release"
  script:
    - npm run tokens:build
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths: [dist/tokens/, dist/tokens.css, dist/compat/tokens.css, .artifacts/mat/]

# MAT-329 (interim, DS-047): token build + generated-output drift + tests/tokens.
# Retires once QUAL's L1/L4 lanes report on next; the same checks then run inside
# qual:certify:l1/l4 through the lane registrations in fragments/lanes/mat.ts.
# Evidence (dist/tokens/, dist/contrast-matrix.json) is copied into the job's own
# .artifacts/mat/<slug>/ dir right after the build; a failed copy fails the job.
mat:test:tokens-interim:
  extends: .mat-base
  stage: test
  allow_failure: true
  rules:
    - if: $AG_LINE == "5x" && $AG_SCOPE != "release"
  script:
    # tokens:build (fails closed > 20 s) + git diff --exit-code on generated outputs
    - node scripts/mat/token-drift-l4.mjs
    - mkdir -p ".artifacts/mat/$CI_JOB_NAME_SLUG"
    - cp -R dist/tokens dist/contrast-matrix.json ".artifacts/mat/$CI_JOB_NAME_SLUG/"
    - npx jest tests/tokens
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths: [.artifacts/mat/]

# REQ-FIN-01 / AC-FIN-01: token-build drift gate — every generated surface equals a
# fresh build, and dist/compat/tokens.css stays <= 8 KB gzip (MAT-021).
mat:test:drift:
  extends: .mat-base
  stage: test
  allow_failure: true
  rules:
    - if: $AG_LINE == "5x" && $AG_SCOPE != "release"
  script:
    - node scripts/tokens/drift.mjs

# MAT-332 / REQ-MAT-17 (D.2-03): L1 Static token gates (undefined-vars, dead-vars,
# tier-skip, types-runtime, literals) + stylelint over src/**/*.css, <= 30 s.
mat:test:token-gates:
  extends: .mat-base
  stage: test
  allow_failure: true
  rules:
    - if: $AG_LINE == "5x" && $AG_SCOPE != "release"
  script:
    - node scripts/mat/token-gates-l1.mjs

# REQ-MAT-18 (D.2-04): literal ratchet on MAT's stream baseline
# (fragments/literals-baseline/mat.json). Exits 1 only for MAT findings.
mat:lint:literals:
  extends: .mat-base
  stage: test
  allow_failure: true
  rules:
    - if: $AG_LINE == "5x" && $AG_SCOPE != "release"
  script:
    - node scripts/tokens/gates/literals.mjs --stream mat

# MAT-344: optics lint, recipe metric and css-api checks on every 5x PR/main.
# The invoked scripts are lane 2b-M's (MAT-096/100/102) — until they merge the
# job cannot go green and stays allow_failure (§4.13.4).
mat:test:optics:
  extends: .mat-base
  stage: test
  allow_failure: true
  rules:
    - if: $AG_LINE == "5x" && $AG_SCOPE != "release"
  script:
    - node scripts/mat/verify-optics-css.mjs
    - node scripts/mat/count-glass-recipes.mjs
    - node scripts/mat/material-css-api.mjs --check
    - npx jest tests/lint tests/ci --passWithNoTests
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    paths: [.artifacts/mat/]
    when: always

# MAT-358: beta gate — strict recipe count (N>1 fails), optics scanner without a
# baseline, and the recipe-removal sweep on every 5x release pipeline. A test-stage
# job (rule 7: certify jobs live only in ci/qual).
mat:test:beta-optics:
  extends: .mat-base
  stage: test
  allow_failure: true
  rules:
    - if: $AG_LINE == "5x" && $AG_SCOPE == "release"
  script:
    - node scripts/mat/count-glass-recipes.mjs --strict
    - node scripts/mat/verify-optics-css.mjs
    - node scripts/mat/verify-recipe-removal.mjs
    - npx eslint 'src/**/*.{ts,tsx}' --format stylish
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    paths: [.artifacts/mat/]
    when: always

# MAT-349: the 'material' Playwright projects are registered as L5 Behaviour and
# L8 Engine-specific cells in fragments/lanes/mat.ts (SC-29). QUAL's lane runner
# (certification/run.mjs, invoked by qual:certify:l5/l8) has not landed on next, so
# this transitional test-stage job runs the same projects on the remote Playwright
# image and stays allow_failure: true (pending) until the runner reports them. It is
# deleted in the PR that lands the runner's first green L5/L8 run.
mat:test:material-browsers:
  extends: [.mat-base, .mat-browser]
  stage: test
  allow_failure: true
  rules:
    - if: $AG_LINE == "5x" && $AG_SCOPE == "pr"
  script:
    - npx playwright test --project=mat:material-chromium --project=mat:material-webkit --project=mat:material-firefox --reporter=line --output=".artifacts/mat/$CI_JOB_NAME_SLUG/test-results"
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    paths: [.artifacts/mat/]
    when: always

# MAT-362 (next half): codemod-fixture integrity + the vendored frozen 4.x
# consumer cases + material unit specs on 5x PR scope. The release/4.x face of
# this check (4.x-era suites on the 4.x line) lives in the 4.x copy of this file.
mat:test:consumer-4x:
  extends: .mat-base
  stage: test
  allow_failure: true
  rules:
    - if: $AG_LINE == "5x" && $AG_SCOPE != "release"
  script:
    - node scripts/mat/codemod-fixtures-check.mjs
    - npx jest tests/fixtures/consumer-4x tests/material --passWithNoTests
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    paths: [.artifacts/mat/]
    when: always

# MAT-43 (D.3-25, REQ-FIN-58): the L9 Motion cell (fragments/lanes/mat.ts row
# tests/motion/**/*.spec.ts) on the remote Playwright image — frame strip
# (>= 3 distinct frames of 12), settle (0 will-change after settle), no-mount
# (0 getAnimations() 50 ms after mount; an absent subject fails), continuous,
# focus, responsive, 4.x reduced-motion and VT optics on the mat:cert-motion-*
# projects. no-peer.spec.ts is the L11 consumer canary and is not run here.
# The motion reporter writes .artifacts/mat/$CI_JOB_NAME_SLUG/motion-report.json;
# the job fails if the report is missing or has no rows. Stories come from QUAL's
# storybook-static artifact (built when absent) served on 127.0.0.1:6006; the
# readiness probe fails the job if it is never served. Transitional like
# mat:test:material-browsers until QUAL's runner reports L9; allow_failure: true
# until its first green on next (ci/plat/activation.json row).
mat:test:motion-l9:
  extends: [.mat-base, .mat-browser]
  stage: test
  allow_failure: true
  rules:
    - if: $AG_LINE == "5x" && $AG_SCOPE == "pr"
  needs:
    - { job: "qual:build:storybook", artifacts: true, optional: true }
  variables:
    AG_STORYBOOK_URL: "http://127.0.0.1:6006"
    AG_MOTION_REPORT_PATH: ".artifacts/mat/$CI_JOB_NAME_SLUG/motion-report.json"
  script:
    - test -f storybook-static/iframe.html || npm run storybook:build
    - >-
      (node -e "const h=require('node:http'),f=require('node:fs'),p=require('node:path');const r=p.resolve('storybook-static');
      const t={'.html':'text/html','.js':'text/javascript','.mjs':'text/javascript','.css':'text/css','.json':'application/json','.svg':'image/svg+xml','.png':'image/png','.woff2':'font/woff2'};
      h.createServer((q,s)=>{const u=decodeURIComponent(new URL(q.url,'http://x').pathname);let fp=p.join(r,p.normalize(u));
      if(!fp.startsWith(r)){s.writeHead(403).end();return}if(f.existsSync(fp)&&f.statSync(fp).isDirectory())fp=p.join(fp,'index.html');
      if(!f.existsSync(fp)){s.writeHead(404).end();return}s.writeHead(200,{'content-type':t[p.extname(fp)]||'application/octet-stream'});f.createReadStream(fp).pipe(s)}).listen(6006,'127.0.0.1')" &)
    - >-
      node -e "const t0=Date.now();(async function w(){try{if((await fetch(process.env.AG_STORYBOOK_URL+'/iframe.html')).ok)process.exit(0)}catch{}
      if(Date.now()-t0>60000){console.error('storybook-static not served within 60 s');process.exit(1)}setTimeout(w,500)})()"
    - >-
      npx playwright test
      tests/motion/frame-strip.spec.ts tests/motion/settle.spec.ts tests/motion/no-mount-motion.spec.ts
      tests/motion/continuous.spec.ts tests/motion/a11y-focus.spec.ts tests/motion/responsive.spec.ts
      tests/motion/reduced-motion-visible-4x.spec.ts tests/motion/view-transition-optics.spec.ts
      tests/motion/helpers-selftest.spec.ts
      --project=mat:cert-motion-chromium --project=mat:cert-motion-webkit --project=mat:cert-motion-firefox
      --project=mat:cert-motion-mobile
      --reporter=line,./tests/motion/helpers/motion-reporter.ts
      --output=".artifacts/mat/$CI_JOB_NAME_SLUG/test-results"
    - >-
      node -e "const r=JSON.parse(require('node:fs').readFileSync(process.env.AG_MOTION_REPORT_PATH,'utf8'));
      if(!Array.isArray(r.subjects)||r.subjects.length===0||r.subjects.some(s=>!s.id)){console.error('motion-report.json has no measured rows');process.exit(1)}
      console.log('motion-report.json: '+r.subjects.length+' rows @ '+r.sha)"
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    paths: [.artifacts/mat/]
    when: always
