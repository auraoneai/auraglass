# ci/mat.gitlab-ci.yml (MAT). cmp and surf seeds are the same with their own key and no job.
.mat-base:
  extends: .ag-node
mat:build:tokens:
  extends: .mat-base
  stage: build
  allow_failure: true
  rules:
    - if: $AG_LINE == "5x" && $AG_SCOPE != "release"
  script:
    - npm run tokens:build
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths: [dist/tokens/, dist/tokens.css, dist/compat/tokens.css, .artifacts/]

# mat:build:bridge (contract §2.4 job spec, verbatim script): replays the
# bridge-4x token build and diffs the committed H cells — src/material
# (compat sheet), src/styles/v5.css, src/styles/preview-v5.css.
mat:build:bridge:
  extends: .mat-base
  stage: build
  rules:
    - if: $AG_LINE == "4x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main")
  script:
    - node scripts/tokens/build.mjs --platform bridge-4x
    - git diff --exit-code src/material src/styles/v5.css src/styles/preview-v5.css
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths: [src/material/, src/styles/v5.css, src/styles/preview-v5.css, dist/tokens/4x/, .artifacts/]

# mat:test:mot-4x (MAT-362): MOT checks with a 4.x face — MOT-006 cookie-consent
# unit specs, codemod↔deprecation fragment coherence (MOT-002/L9/L12), T06
# surface guarded by the consumer fixture authored on next.
mat:test:mot-4x:
  extends: .mat-base
  stage: test
  rules:
    - if: $AG_LINE == "4x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main")
  script:
    - node scripts/mat/mot-4x-check.mjs
    - npx jest src/components/cookie-consent --runInBand --ci
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths: [.artifacts/]
