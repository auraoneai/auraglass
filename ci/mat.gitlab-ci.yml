# ci/mat.gitlab-ci.yml (MAT). cmp and surf seeds are the same with their own key and no job.
.mat-base:
  extends: .ag-node
mat:build:tokens:
  extends: .mat-base
  stage: build
  allow_failure: true
  rules:
    - if: $AG_LINE == "5x" && $AG_SCOPE != "release"
  script:
    - npm run tokens:build
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    paths: [dist/tokens/, dist/tokens.css, dist/compat/tokens.css, .artifacts/]

# mat:build:bridge (contract §2.4 job spec, verbatim script): replays the
# bridge-4x token build and diffs the committed H cells — src/material
# (compat sheet), src/styles/v5.css, src/styles/preview-v5.css.
mat:build:bridge:
  extends: .mat-base
  stage: build
  rules:
    - if: $AG_LINE == "4x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main")
  script:
    - node scripts/tokens/build.mjs --platform bridge-4x
    - git diff --exit-code src/material src/styles/v5.css src/styles/preview-v5.css
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    paths: [src/material/, src/styles/v5.css, src/styles/preview-v5.css, dist/tokens/4x/, .artifacts/]

# mat:test:mot-4x (MAT-362): MOT checks with a 4.x face — MOT-006 cookie-consent
# unit specs, codemod↔deprecation fragment coherence (MOT-002/L9/L12), T06
# surface guarded by the consumer fixture authored on next.
mat:test:mot-4x:
  extends: .mat-base
  stage: test
  rules:
    - if: $AG_LINE == "4x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main")
  script:
    - node scripts/mat/mot-4x-check.mjs
    - npx jest src/components/cookie-consent --runInBand --ci
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 14 days
    paths: [.artifacts/]

# mat:test:bridge (REQ-MAT-41 / REQ-FIN-57): colocated bridge tests — fresh-compile drift,
# the six 4.x primitives under data-ag-preview="v5" vs the ladders.css cells, the
# no-attribute no-match proof, v5.css durations and the D-28 compat block.
mat:test:bridge:
  extends: .mat-base
  stage: test
  allow_failure: true
  rules:
    - if: $AG_LINE == "4x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main")
  script:
    - mkdir -p ".artifacts/mat/$CI_JOB_NAME_SLUG"
    - npx jest src/material --ci --runInBand --json --outputFile=".artifacts/mat/$CI_JOB_NAME_SLUG/jest.json"
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths: [.artifacts/mat/]

# mat:test:preview-v5 (REQ-MAT-41 item 6, AC-MAT-31): remote pixel check on the frozen 4.x
# consumer fixture, 3 engines — 0 changed pixels without data-ag-preview, and the six
# primitives' ::before filter equals the ladders.css cell with it.
mat:test:preview-v5:
  extends: [.mat-base, .ag-playwright]
  stage: test
  allow_failure: true
  rules:
    - if: $AG_LINE == "4x" && ($AG_SCOPE == "pr" || $AG_SCOPE == "main")
  script:
    - mkdir -p ".artifacts/mat/$CI_JOB_NAME_SLUG"
    - AG_MAT_REPORT="$CI_PROJECT_DIR/.artifacts/mat/$CI_JOB_NAME_SLUG/results.json" npx playwright test --config src/material/visual/playwright.bridge.config.mjs --output ".artifacts/mat/$CI_JOB_NAME_SLUG/test-results"
  artifacts:
    name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths: [.artifacts/mat/]
