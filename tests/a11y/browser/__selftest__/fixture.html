<!doctype html>
<!-- APG harness self-test fixture (QUAL, REQ-QUAL-20). Loaded with page.setContent by harness.selftest.spec.ts.
     Focus moves by script (roving tabindex on ArrowRight/ArrowLeft), never by Tab, so every engine behaves alike.
     The base page is axe-clean; the self-test appends the negative fragments (missing alt, low contrast,
     content outside landmarks) per case. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>APG harness self-test</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; color: #111111; background: #ffffff; margin: 24px; }
    .low { color: #bbbbbb; background: #ffffff; }
    [role="toolbar"] { display: flex; gap: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>APG harness self-test</h1>
    <div role="toolbar" aria-label="Fixture controls" id="toolbar">
      <button type="button" data-ag-part="first" tabindex="0">First</button>
      <button type="button" data-ag-part="trigger" id="disclosure" tabindex="-1" aria-expanded="false" aria-controls="panel">Details</button>
      <div role="slider" data-ag-part="thumb" tabindex="-1" aria-label="Volume" aria-valuemin="0" aria-valuemax="10" aria-valuenow="5"></div>
    </div>
    <div id="panel" hidden>Panel content</div>
    <p><label for="field">Name</label> <input id="field" data-ag-part="input" type="text"></p>
    <div data-ag-announcer><div aria-live="polite" id="live"></div></div>
  </main>
  <script>
    (function () {
      var items = Array.prototype.slice.call(document.querySelectorAll('#toolbar > [tabindex]'));
      var live = document.getElementById('live');
      var disclosure = document.getElementById('disclosure');
      var panel = document.getElementById('panel');
      var field = document.getElementById('field');
      var slider = document.querySelector('[role="slider"]');
      function move(by) {
        var i = items.indexOf(document.activeElement);
        if (i < 0) return;
        var next = items[(i + by + items.length) % items.length];
        items.forEach(function (el) { el.setAttribute('tabindex', el === next ? '0' : '-1'); });
        next.focus();
      }
      document.getElementById('toolbar').addEventListener('keydown', function (e) {
        if (e.key === 'ArrowRight' && document.activeElement !== slider) { e.preventDefault(); move(1); }
        else if (e.key === 'ArrowLeft' && document.activeElement !== slider) { e.preventDefault(); move(-1); }
        else if (e.key === 'Home') { e.preventDefault(); items[0].focus(); }
      });
      disclosure.addEventListener('click', function () {
        var open = disclosure.getAttribute('aria-expanded') !== 'true';
        disclosure.setAttribute('aria-expanded', String(open));
        panel.hidden = !open;
        live.textContent = open ? 'Details expanded' : 'Details collapsed';
      });
      slider.addEventListener('keydown', function (e) {
        var v = Number(slider.getAttribute('aria-valuenow'));
        if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); slider.setAttribute('aria-valuenow', String(Math.min(10, v + 1))); }
        else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); slider.setAttribute('aria-valuenow', String(Math.max(0, v - 1))); }
        else if (e.key === 'Escape') { e.preventDefault(); items[0].focus(); }
      });
      field.addEventListener('input', function () { field.setAttribute('data-value', field.value); });
    })();
  </script>
</body>
</html>
