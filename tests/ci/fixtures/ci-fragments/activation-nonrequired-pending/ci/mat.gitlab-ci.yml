.mat-base: { extends: .ag-node }
mat:build:seed:
  extends: .mat-base
  stage: build
  allow_failure: true
  rules: [{ if: "$AG_SCOPE == \"pr\"" }]
  script: [npm run build]
  artifacts: { name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA", when: always, expire_in: 14 days, paths: [.artifacts/mat/] }
