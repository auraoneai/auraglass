.qual-base: { extends: .ag-node }
qual:build:seed:
  extends: .qual-base
  stage: build
  allow_failure: true
  rules: [{ if: "$AG_SCOPE == \"pr\"" }]
  script: [npm run build]
  artifacts: { name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA", when: always, expire_in: 14 days, paths: [.artifacts/qual/] }
