.plat-base: { extends: .ag-node }
plat:gate:glass-quality: { extends: .plat-base, stage: test, allow_failure: true, rules: [{ if: "$AG_SCOPE == \"pr\"" }], script: [echo ok] }
plat:integration:next: { extends: .plat-base, stage: test, allow_failure: true, rules: [{ if: "$AG_SCOPE == \"pr\"" }], script: [echo ok] }
plat:integration:vite: { extends: .plat-base, stage: test, allow_failure: true, rules: [{ if: "$AG_SCOPE == \"pr\"" }], script: [echo ok] }
plat:gate:change-class: { extends: .plat-base, stage: test, allow_failure: true, rules: [{ if: "$AG_SCOPE == \"pr\"" }], script: [echo ok] }
# REQ-PLAT-62 shape: credential-free verify jobs with evidence; the CLI is
# published from plat:publish:npm, the only job holding id_tokens.
.plat-release: { extends: [.plat-base, .ag-evidence-release] }
plat:release:verify-codemods:
  extends: .plat-release
  stage: publish
  rules: [{ if: "$AG_SCOPE == \"release\" && $CI_COMMIT_TAG =~ /^v4\\.3\\./" }]
  script: [mkdir -p ".artifacts/plat/$CI_JOB_NAME_SLUG"]
  artifacts: { name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA", when: always, expire_in: 90 days, paths: [".artifacts/plat/$CI_JOB_NAME_SLUG/"] }
plat:release:verify-cli:
  extends: .plat-release
  stage: publish
  rules: [{ if: "$AG_SCOPE == \"release\" && $CI_COMMIT_TAG =~ /^v4\\.3\\./", when: manual, allow_failure: false }]
  script: [npm test -w packages/cli]
  artifacts: { name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA", when: always, expire_in: 90 days, paths: [".artifacts/plat/$CI_JOB_NAME_SLUG/"] }
plat:publish:npm:
  extends: [.plat-base, .ag-evidence-release]
  stage: publish
  environment: { name: npm-publish, deployment_tier: production }
  rules: [{ if: "$AG_SCOPE == \"release\"" }]
  needs:
    - { job: "plat:release:verify-codemods", artifacts: true, optional: true }
    - { job: "plat:release:verify-cli", artifacts: true, optional: true }
  id_tokens:
    NPM_ID_TOKEN: { aud: "npm:registry.npmjs.org" }
    SIGSTORE_ID_TOKEN: { aud: "sigstore" }
  script: [npm publish -w packages/cli --access public --provenance]
