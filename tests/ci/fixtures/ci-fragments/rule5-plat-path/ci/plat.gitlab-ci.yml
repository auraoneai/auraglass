.plat-base: { extends: .ag-node }
# REQ-PLAT-51: evidence written to the flat .artifacts/pack/ dir instead of .artifacts/plat/<job-slug>/
plat:gate:glass-quality: { extends: .plat-base, stage: test, allow_failure: true, rules: [{ if: "$AG_SCOPE == \"pr\"" }], script: [echo ok], artifacts: { name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA", when: always, expire_in: "14 days", paths: [".artifacts/pack/"] } }
plat:integration:next: { extends: .plat-base, stage: test, allow_failure: true, rules: [{ if: "$AG_SCOPE == \"pr\"" }], script: [echo ok] }
plat:integration:vite: { extends: .plat-base, stage: test, allow_failure: true, rules: [{ if: "$AG_SCOPE == \"pr\"" }], script: [echo ok] }
plat:gate:change-class: { extends: .plat-base, stage: test, allow_failure: true, rules: [{ if: "$AG_SCOPE == \"pr\"" }], script: [echo ok] }
