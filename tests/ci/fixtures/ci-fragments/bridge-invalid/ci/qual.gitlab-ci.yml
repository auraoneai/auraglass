.qual-base: { extends: .ag-node }
qual:build:seed:
  extends: .qual-base
  stage: build
  allow_failure: true
  rules: [{ if: "$AG_SCOPE == \"pr\"" }]
  script: [npm run build]
  artifacts: { name: "evidence-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA", when: always, expire_in: 14 days, paths: [.artifacts/qual/] }
# invalid bridge: a script key, no strategy: depend, a foreign job's artifact
qual:certify:child:
  stage: certify
  needs: [{ job: "qual:build:seed", artifacts: true }]
  rules: [{ if: "$AG_SCOPE == \"release\"" }]
  variables: { PARENT_PIPELINE_ID: $CI_PIPELINE_ID }
  script: [echo hi]
  trigger:
    include: [{ artifact: .artifacts/plat/child.gitlab-ci.yml, job: "plat:build:dist" }]
